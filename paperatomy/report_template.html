<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperatomy · 论文解剖</title>
<style>
  :root {
    --bg:       #FAF8F4;
    --card:     #FFFFFF;
    --ink:      #1B2430;
    --ink2:     #56616F;
    --ink3:     #8A94A2;
    --line:     #E7E2D8;
    --line2:    #F1EDE5;
    --accent:   #2E6F8E;
    --accent2:  #4A9BBF;
    --soft:     #E7F1F6;
    --warn:     #B8703F;
    --warnSoft: #FBF1E6;
    --ok:       #4E9A72;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas,
            "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px 96px; }

  header.top { padding: 56px 0 28px; border-bottom: 1px solid var(--line); }
  .kicker {
    font-family: var(--mono); font-size: 12px; letter-spacing: .12em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 14px; font-size: 30px; line-height: 1.3;
    letter-spacing: -.015em; font-weight: 600; max-width: 40ch;
  }
  .meta { font-size: 13px; color: var(--ink3); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta b { font-weight: 600; color: var(--ink2); }

  nav.jump {
    position: sticky; top: 0; z-index: 20;
    background: rgba(250,248,244,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; margin-bottom: 34px;
  }
  .jump-links { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
  nav.jump a {
    font-size: 13px; color: var(--ink2); text-decoration: none;
    padding: 5px 12px; border-radius: 7px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  nav.jump a:hover { background: var(--line2); color: var(--ink); }
  .jump-toggle {
    flex: none; font-size: 12px; font-family: inherit;
    color: var(--ink2); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 12px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .jump-toggle:hover { border-color: var(--accent2); color: var(--accent); }

  .hero {
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 14px; padding: 30px 34px; margin-bottom: 42px;
    box-shadow: 0 1px 2px rgba(27,36,48,.03), 0 8px 28px rgba(27,36,48,.045);
  }
  .hero .label {
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 12px;
  }
  .hero p { margin: 0; font-size: 20px; line-height: 1.72; letter-spacing: -.01em; }

  section.group { margin-bottom: 52px; scroll-margin-top: 68px; }
  .g-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .g-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .g-head .count { font-size: 12px; color: var(--ink3); font-family: var(--mono); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 16px; align-items: start;
  }

  article.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gc, var(--line));
    border-radius: 12px; padding: 0; overflow: hidden;
    transition: border-color .18s, box-shadow .18s;
  }
  article.card:hover { border-color: #D8D1C3; box-shadow: 0 4px 18px rgba(27,36,48,.05); }
  .c-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; cursor: pointer; user-select: none;
  }
  .c-head h3 { margin: 0; font-size: 14.5px; font-weight: 600; flex: 1; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink3); white-space: nowrap;
  }
  .badge.low { color: var(--warn); border-color: var(--warn); background: var(--warnSoft); }
  .chev {
    width: 16px; height: 16px; flex: none; color: var(--ink3);
    transition: transform .2s;
  }
  article.open .chev { transform: rotate(90deg); }

  .c-body { display: none; padding: 0 20px 18px; }
  article.open .c-body { display: block; }
  .c-body .txt { font-size: 14.5px; line-height: 1.8; color: var(--ink2); }
  .c-body .txt p { margin: 0 0 12px; }
  .c-body .txt p:last-child { margin-bottom: 0; }

  .txt ul { margin: 0 0 12px; padding-left: 20px; }
  .txt li { margin-bottom: 5px; }
  .txt ul ul { margin-top: 5px; margin-bottom: 0; }
  .txt li::marker { color: var(--accent2); }

  .ev { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .ev-title {
    font-size: 11.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink3); text-transform: uppercase; margin-bottom: 9px;
  }
  .ev-item { display: flex; gap: 10px; margin-bottom: 9px; font-size: 13px; line-height: 1.65; }
  .ev-item:last-child { margin-bottom: 0; }
  .ev-page {
    flex: none; font-family: var(--mono); font-size: 11px;
    color: var(--accent); background: var(--soft);
    border-radius: 5px; padding: 1px 7px; height: fit-content;
    min-width: 40px; text-align: center;
  }
  .ev-quote { color: var(--ink3); font-style: italic; }

  .empty { color: var(--ink3); font-style: italic; }

  /* ---------- 论证链（深色舞台） ---------- */
  /* 深色内嵌舞台是刻意的：它把这块和正文区分开，读起来像「一段视频」而不是「又一段文字」 */
  .chain-card {
    position: relative;
    border-radius: 16px;
    padding: 24px 26px 18px;
    background: radial-gradient(115% 130% at 12% 0%, #22303F 0%, #141D27 45%, #0E141B 100%);
    box-shadow: 0 20px 50px rgba(16, 24, 34, .28);
    overflow: hidden;
    color: #E9EFF6;
  }
  .chain-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.028) 1px, transparent 1px);
    background-size: 26px 26px;
    -webkit-mask-image: radial-gradient(85% 80% at 50% 25%, #000 35%, transparent 100%);
    mask-image: radial-gradient(85% 80% at 50% 25%, #000 35%, transparent 100%);
  }
  .chain-card > * { position: relative; }

  .chain-thesis {
    margin: 0 0 20px; padding-left: 13px;
    border-left: 2px solid rgba(111,179,217,.6);
    font-size: 15px; line-height: 1.72; color: #D8E4F0;
  }
  .chain-thesis b {
    color: #8FD2F0; font-weight: 600; letter-spacing: .08em;
    margin-right: 9px; font-size: 11.5px; text-transform: uppercase;
  }

  /* --- 链条横排 --- */
  .chain-rail { display: flex; align-items: stretch; margin-bottom: 20px; }
  .cc {
    flex: 1 1 0; min-width: 92px; max-width: 172px; position: relative;
    padding: 11px 10px 12px; border-radius: 11px;
    border: 1px solid rgba(255,255,255,.13);
    background: rgba(255,255,255,.035);
    cursor: pointer; opacity: .4;
    transition: opacity .45s ease, transform .45s cubic-bezier(.34,1.4,.64,1),
                border-color .45s, background .45s, box-shadow .45s;
  }
  .cc:hover { opacity: .72; }
  .cc.is-done {
    opacity: .82; border-color: rgba(255,255,255,.2);
    background: rgba(255,255,255,.06);
  }
  .cc.is-active {
    opacity: 1; transform: translateY(-5px);
    background: rgba(255,255,255,.1);
    border-color: var(--c);
    box-shadow: 0 0 0 1px var(--c), 0 16px 36px -10px var(--c);
  }
  .cc-t {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; letter-spacing: .1em; color: #9FB0C2; margin-bottom: 5px;
  }
  .cc-t i { display: block; width: 6px; height: 6px; border-radius: 2px; background: var(--c); flex: none; }
  .cc-l { font-size: 12.5px; line-height: 1.45; color: #C6D5E4; }
  .cc.is-active .cc-l { color: #fff; font-weight: 600; }

  .cl { flex: 0 0 26px; align-self: center; height: 2px; position: relative; }
  .cl::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(255,255,255,.13); transition: background .4s;
  }
  .cl.on::before { background: linear-gradient(90deg, rgba(143,210,240,.12), rgba(143,210,240,.6)); }
  .cl::after {
    content: ""; position: absolute; right: -1px; top: -3px;
    border: 4px solid transparent; border-left-color: rgba(255,255,255,.13);
    transition: border-left-color .4s;
  }
  .cl.on::after { border-left-color: rgba(143,210,240,.65); }
  .cl i {
    position: absolute; top: -2.5px; left: 0; width: 7px; height: 7px;
    border-radius: 50%; background: #8FD2F0;
    box-shadow: 0 0 10px 2px rgba(143,210,240,.8);
    opacity: 0;
  }
  .cl.flow i { animation: chainTravel .95s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes chainTravel {
    0%   { left: 0; opacity: 0; }
    25%  { opacity: 1; }
    75%  { opacity: 1; }
    100% { left: calc(100% - 7px); opacity: 0; }
  }

  /* --- 详情舞台 --- */
  .chain-detail {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px; padding: 16px 18px;
    /* 固定舞台高度：播放时页面不能上下跳，跳了就不像在放片子 */
    min-height: 196px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .forks { margin: 10px 0 2px; }
  .forks-cap {
    font-size: 11.5px; letter-spacing: 1px; color: #9FB4C8;
    margin-bottom: 6px;
  }
  .fork-card {
    border: 1px dashed rgba(143,210,240,.35); border-radius: 8px;
    padding: 7px 11px; margin-bottom: 6px; font-size: 12.5px;
    background: rgba(143,210,240,.06);
  }
  .fork-card b { color: #BFE0F2; display: block; margin-bottom: 2px; }
  .fork-card span { color: #C6D5E4; }
  .cd-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
  .cd-badge {
    font-size: 10.5px; letter-spacing: .08em;
    padding: 2px 8px; border-radius: 5px;
    background: rgba(255,255,255,.08); color: #BFD1E2;
  }
  .cd-title { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -.01em; }
  .cd-text { margin: 0 0 12px; font-size: 13.5px; line-height: 1.72; color: #A9BACC; }
  .cd-text:last-child { margin-bottom: 0; }

  /* 改动前后对照 */
  .delta { display: grid; grid-template-columns: 1fr 26px 1fr; gap: 10px; align-items: stretch; }
  .delta-col {
    background: rgba(255,255,255,.03);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 9px; padding: 10px 12px; min-width: 0;
  }
  .delta-col.before { border-color: rgba(232,131,107,.32); }
  .delta-col.after  { border-color: rgba(126,208,168,.34); }
  .delta-tag { font-size: 10px; letter-spacing: .1em; margin-bottom: 8px; }
  .delta-col.before .delta-tag { color: #E8836B; }
  .delta-col.after  .delta-tag { color: #7ED0A8; }
  .delta-arrow { align-self: center; text-align: center; color: #8FD2F0; font-size: 17px; }

  /* 图示：token 序列 */
  .dg-cap { font-size: 10.5px; color: #7A8B9D; margin-bottom: 7px; }
  .dg { display: flex; gap: 4px; flex-wrap: wrap; }
  .dg-tk {
    width: 15px; height: 15px; border-radius: 3px;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1);
  }
  .run .dg-tk {
    animation: tkLit .34s ease forwards;
    animation-delay: calc(var(--d) * 1s);
  }
  @keyframes tkLit {
    to { background: #6FB3D9; border-color: #8FD2F0; box-shadow: 0 0 7px rgba(143,210,240,.5); }
  }
  /* 改动前用暖色：新旧不只是「快慢」，还要一眼看出是两套东西 */
  .run .delta-col.before .dg-tk {
    animation-name: tkLitWarm;
  }
  @keyframes tkLitWarm {
    to { background: #B8763F; border-color: #E8836B; box-shadow: 0 0 7px rgba(232,131,107,.45); }
  }

  /* 图示：指标条 */
  .dg-bars { display: flex; flex-direction: column; gap: 7px; }
  .dg-bar { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9FB0C2; }
  .dg-bar > span:first-child { width: 56px; flex: none; text-align: right; }
  .dg-track {
    flex: 1; height: 9px; border-radius: 5px;
    background: rgba(255,255,255,.07); overflow: hidden; min-width: 40px;
  }
  .dg-fill {
    display: block; height: 100%; width: 0; border-radius: 5px;
    background: linear-gradient(90deg, #3C7FA0, #8FD2F0);
    transition: width .9s cubic-bezier(.2,.8,.2,1);
  }
  .run .dg-fill { width: var(--w); }
  .dg-val { width: 42px; flex: none; color: #C6D5E4; font-variant-numeric: tabular-nums; }

  /* 图示：模块块 */
  .dg-blocks { display: flex; gap: 5px; }
  .dg-bl {
    flex: 1; min-width: 0; padding: 7px 4px; text-align: center;
    font-size: 10.5px; line-height: 1.3; border-radius: 6px;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09);
    color: #A9BACC;
    overflow: hidden; text-overflow: ellipsis;
  }
  .dg-bl.hl {
    background: rgba(111,179,217,.22); border-color: #6FB3D9;
    color: #fff; font-weight: 600;
  }
  /* 改动前的高亮走暖色，和左侧那一栏的边框同色系 */
  .delta-col.before .dg-bl.hl {
    background: rgba(232,131,107,.2); border-color: #E8836B;
  }

  .dg-text { margin: 0; font-size: 12.5px; line-height: 1.65; color: #A9BACC; }

  /* 大数字 */
  .metric { display: flex; align-items: baseline; gap: 9px; margin: 6px 0 2px; flex-wrap: wrap; }
  .metric-n {
    font-size: 40px; font-weight: 700; letter-spacing: -.03em;
    color: #8FE0B4; font-variant-numeric: tabular-nums; line-height: 1.05;
  }
  .metric-u { font-size: 17px; color: #7ED0A8; }
  .metric-l { font-size: 12px; color: #9FB0C2; }

  /* 分类树（在深色舞台上） */
  .cd-tax { font-size: 12.5px; }
  .ct { display: flex; align-items: baseline; gap: 7px; padding: 2px 0; }
  .ct-dot {
    width: 5px; height: 5px; border-radius: 1.5px; flex: none;
    background: #9B9BE0; margin-top: 6px;
  }
  .ct[data-d="2"] .ct-dot { background: rgba(255,255,255,.25); width: 4px; height: 4px; }
  .ct-n { color: #D8E4F0; }
  .ct[data-d="2"] .ct-n { color: #A9BACC; }
  .ct-w { color: #7A8B9D; font-size: 11.5px; }
  .ct-kids { margin-left: 11px; padding-left: 13px; border-left: 1px solid rgba(255,255,255,.1); }

  .cd-ev {
    margin-top: 11px; display: flex; gap: 8px; align-items: baseline;
    font-size: 11.5px; color: #7A8B9D;
  }
  .cd-ev b { color: #8FD2F0; font-family: var(--mono); font-weight: 500; flex: none; }
  .cd-ev span { font-style: italic; }

  /* --- 播放条 --- */
  .chain-bar { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
  .cb-btn {
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: #0E141B; background: #8FD2F0; border: 0;
    border-radius: 8px; padding: 7px 16px; cursor: pointer;
    transition: background .15s;
  }
  .cb-btn:hover { background: #A9DEF5; }
  .cb-btn.ghost {
    background: rgba(255,255,255,.08); color: #C6D5E4;
    font-weight: 500; padding: 7px 11px;
  }
  .cb-btn.ghost:hover { background: rgba(255,255,255,.16); color: #fff; }
  .cb-track {
    flex: 1; height: 4px; border-radius: 2px; position: relative;
    background: rgba(255,255,255,.1); cursor: pointer; min-width: 60px;
  }
  .cb-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0;
    border-radius: 2px;
    background: linear-gradient(90deg, #3C7FA0, #8FD2F0);
    transition: width .4s ease;
  }
  .cb-count {
    font-family: var(--mono); font-size: 11.5px; color: #9FB0C2;
    min-width: 44px; text-align: right;
  }

  .chain-warn { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .chain-warn span {
    font-size: 11.5px; color: #E0B479;
    background: rgba(224,180,121,.1);
    border: 1px solid rgba(224,180,121,.25);
    border-radius: 6px; padding: 2px 9px;
  }

  @media (max-width: 800px) {
    .chain-card { padding: 18px 16px 14px; }
    .chain-rail { overflow-x: auto; padding-bottom: 8px; }
    .cc { min-width: 112px; }
    .delta { grid-template-columns: 1fr; }
    .delta-arrow { transform: rotate(90deg); }
    .metric-n { font-size: 32px; }
  }

  footer {
    margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink3);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  @media print {
    nav.jump, .chev { display: none; }
    article.card { break-inside: avoid; border-color: #ccc; }
    .c-body { display: block !important; }
    /* v0.7 增强：追问面板与悬浮按钮不进纸面；板块整体不跨页 */
    .print-fab, .ask-fab, .ask-panel { display: none !important; }
    section.group { break-inside: avoid; }
    .chain-stage, .net-svg { break-inside: avoid; }
    header.top { position: static; box-shadow: none; }
  }

  /* ---------- 证据：章节 · 段号 · 中英对照 ---------- */
  /* 从「p.13」升级到「§4.2 · 第 3 段 · p.11」：页码只告诉你在哪一页，
     段号才告诉你在哪一段。英文原文保留，中文译文放在下面一行。 */
  .ev-item {
    display: block;
    margin-bottom: 14px; padding-left: 12px;
    border-left: 2px solid var(--line2);
  }
  .ev-item:last-child { margin-bottom: 0; }
  .ev-loc {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin-bottom: 5px;
  }
  .ev-loc .chip {
    font-family: var(--mono); font-size: 11px; color: var(--accent);
    background: var(--soft); border-radius: 5px; padding: 1px 7px;
  }
  .ev-loc .sec {
    font-size: 11.5px; color: var(--ink3);
    max-width: 30ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .ev-loc .raw {
    font-size: 10.5px; color: var(--warn); background: var(--warnSoft);
    border-radius: 5px; padding: 0 6px; white-space: nowrap;
  }
  .ev-src {
    font-size: 12.5px; line-height: 1.62; color: var(--ink3);
    font-style: italic; margin-bottom: 3px;
  }
  .ev-zh { font-size: 13.5px; line-height: 1.72; color: var(--ink2); }
  .ev-zh.none { color: var(--ink3); font-size: 12.5px; }


  /* ---------- 文献网络 ---------- */
  /* 径向双叶：中心是本文，左半圆是它引用的（过去），右半圆是引用它的（未来）。
     节点大小 = 被引影响力，颜色深浅 = 与本文相关度。全部为数据事实。 */
  .net-wrap {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 18px 20px 14px;
  }
  .net-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .net-title { font-weight: 600; font-size: 14.5px; }
  .net-stats {
    margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink3);
  }
  .net-svg { width: 100%; height: auto; display: block; margin-top: 4px; }
  .net-edge { stroke: var(--line); stroke-width: 1; fill: none; opacity: .8; }
  .net-edge.hot { stroke: var(--accent2); stroke-width: 1.8; opacity: 1; }
  .net-node { cursor: pointer; }
  .net-node circle {
    transition: stroke-width .15s;
    stroke: #fff; stroke-width: 1.5;
  }
  .net-node:hover circle { stroke-width: 3; }
  .net-node text {

<script>window.__PA_SERVE__ = null;</script>

<script id="paper-data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("paper-data").textContent);

  // 每个分组一个色调，卡片左侧色条用它，视觉上能一眼分清「概览 / 框架 / 结论 / 判断」
  var GROUP_COLORS = ["#2E6F8E", "#4A9BBF", "#7A9E7E", "#B8703F"];

  document.getElementById("title").textContent = D.paper_title || "（未识别标题）";
  document.title = (D.paper_title || "论文解剖") + " · paperatomy";

  var meta = [];
  if (D.template_name) { meta.push("<span>模板 <b>" + esc(D.template_name) + "</b></span>"); }
  if (D.pages)        { meta.push("<span><b>" + D.pages + "</b> 页</span>"); }
  if (D.blocks)       { meta.push("<span><b>" + D.blocks + "</b> 个板块</span>"); }
  if (D.model)        { meta.push("<span>模型 <b>" + esc(D.model) + "</b></span>"); }
  document.getElementById("meta").innerHTML = meta.join("");

  var jump = [];
  var main = [];
  // 必须先声明：后面的 chainSection() 会用到，
  // var 只有声明提升、赋值不提升（上一版踩过：整页空白）
  var CHAIN = D.chain || null;

  // 「一句话结论」单独抽出来做页首大卡：它是整篇最该被先看到的一句，
  // 混在卡片堆里会被淹掉。
  var hero = null;
  D.groups.forEach(function (g) {
    g.blocks = g.blocks.filter(function (b) {
      if (!hero && b.id === "tl_dr") { hero = b; return false; }
      return true;
    });
  });
  D.groups = D.groups.filter(function (g) { return g.blocks.length; });

  if (hero) {
    var hh = ['<div class="hero"><div class="label">' + esc(hero.title) + "</div>"];
    hh.push("<p>" + esc(hero.content || "论文未提及。") + "</p>");
    if (hero.evidence && hero.evidence.length) {
      hh.push(evHTML(hero.evidence));
    }
    hh.push("</div>");
    main.push(hh.join(""));
  }

  // 论证链放在页首大卡之后：它比正文更值得先看，
  // 但要排在「一句话结论」后面，否则读者没有上下文。
  if (CHAIN && CHAIN.nodes && CHAIN.nodes.length) {
    jump.push('<a href="#chain">论证链</a>');
    main.push(chainSection());
  }

  // 文献网络跟在论证链后：先看推理线，再看它在领域里的位置。
  // 无数据时也渲染占位板块（提示如何补跑），功能存在感不能只在文档里。
  main.push(networkSection());
  if (D.network && D.network.nodes && D.network.nodes.length) {
    jump.push('<a href="#network">文献网络</a>');
  }

  D.groups.forEach(function (g, gi) {
    var anchor = "g" + gi;
    jump.push('<a href="#' + anchor + '">' + esc(g.name) + "</a>");

    var gc = GROUP_COLORS[gi % GROUP_COLORS.length];
    main.push('<section class="group" id="' + anchor + '" style="--gc:' + gc + '">');
    main.push('<div class="g-head"><h2>' + esc(g.name) + "</h2>");
    main.push('<span class="count">' + g.blocks.length + " 块</span></div>");

    var single = g.blocks.length === 1;
    main.push('<div class="cards' + (single ? " single" : "") + '">');

    g.blocks.forEach(function (b, bi) {
      // 默认全部展开：这是给人读的报告，不是目录。
      // 折叠是「太长时收起来」的手段，不该是打开时的默认状态。
      var open = " open";
      main.push('<article class="card' + open + '">');
      main.push('<div class="c-head">');
      main.push('<h3>' + esc(b.title) + "</h3>");
      if (b.confidence === "low") {
        main.push('<span class="badge low">低置信</span>');
      }
      main.push(askBtn("b:" + b.id));
      main.push('<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
                'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M6 4l4 4-4 4"/></svg>');
      main.push("</div>");

      main.push('<div class="c-body">');
      if (b.empty) {
        main.push('<div class="txt"><p class="empty">论文未提及，或材料不足未抽取到内容。</p></div>');
      } else {
        main.push('<div class="txt">' + formatText(b.content) + "</div>");
      }
      if (b.evidence && b.evidence.length) {
        main.push(evHTML(b.evidence));
      }
      main.push('<div class="mod-figs" data-bid="' + esc(b.id || "") +
        '"></div>');
      main.push("</div></article>");
    });

    main.push("</div></section>");
  });

    main.push('<section style="margin-top:22px"><details id="figAnnex">' +
      '<summary style="cursor:pointer;font-weight:600;color:var(--ink2)">' +
      "附图 · 未归入上述模块的图表</summary>" +
      '<div id="figAnnexBody" style="margin-top:12px"></div></details></section>');
  document.getElementById("jump").innerHTML = jump.join("");
  document.getElementById("main").innerHTML = main.join("");
  initChain();
  initNetwork();

  // ---- 图进模块（v0.11.0）：/api/modfigs 分配 → 模块内懒加载 ----
  var TD = [];
  var FIG = {file: encodeURIComponent(__PA_SERVE__.report), timer: null,
             tdTimer: null, tdModules: {}};

// ---- 数据动图：表格数据 → 动画条形图 ----
  function renderBars(tables) {
    TD = tables;
    var th = "";
    tables.forEach(function (tb, ti) {
      var cands = tdPickCols(tb);
      if (!cands.length) { return; }
      var trend = tdIsTrend(tb);
      th += '<div class="bar-cap">' + esc(tb.cap || ("表 " + (ti + 1))) + '</div>';
      th += '<div class="td-chips">';
      if (trend) {
        th += '<span class="td-type on" data-ti="' + ti +
          '" data-type="line">折线（看趋势）</span>' +
          '<span class="td-type" data-ti="' + ti +
          '" data-type="bar">柱状</span>';
      }
      cands.forEach(function (cd, ci) {
        th += '<span class="td-chip' + (ci === 0 ? ' on' : '') +
          '" data-ti="' + ti + '" data-c="' + cd.c + '">' +
          esc(String(tb.columns[cd.c]).slice(0, 14)) + '</span>';
      });
      th += '</div>';
      th += '<div class="td-svg" data-ti="' + ti + '">' +
        (trend ? tdLine(tb, cands[0].c, ti)
               : tdSvg(tb, cands[0].c, ti)) + '</div>' +
        '<div class="bar-note">数据来自论文，点击列名/类型可切换</div>';
    });
    return th;
  }
  function tdPickCols(tb) {
    var cols = tb.columns || [], rows = tb.rows || [];
    var cands = [];
    for (var c = 1; c < cols.length; c++) {
      var ok = 0, sum = 0, sq = 0;
      rows.forEach(function (r) {
        var v = parseFloat(String(r[c]).replace(/[,%××\s]/g, ""));
        if (isFinite(v)) { ok++; sum += Math.abs(v); sq += v * v; }
      });
      if (ok < Math.ceil(rows.length * 0.6) || sum === 0) { continue; }
      var mean = sum / ok;
      cands.push({ c: c, sum: sum, va: sq / ok - mean * mean });
    }
    cands.sort(function (a, b) { return b.va - a.va || b.sum - a.sum; });
    return cands;
  }
  function tdIsTrend(tb) {
    // 首列多数为数值/年份且整体递增 → 趋势型，可画折线
    var rows = tb.rows || [];
    if (rows.length < 3) { return false; }
    var nums = rows.map(function (r) {
      var s0 = String(r[0]).trim();
      var v = parseFloat(s0);
      if (isFinite(v) && /^\d{1,4}([.,]\d+)?$/.test(s0)) { return v; }
      var m = s0.match(/(?:19|20)\d{2}/);
      return m ? parseFloat(m[0]) : NaN;
    });
    var fin = nums.filter(function (v) { return isFinite(v); });
    if (fin.length < Math.ceil(rows.length * 0.7)) { return false; }
    var inc = 0;
    for (var i = 1; i < nums.length; i++) {
      if (isFinite(nums[i]) && isFinite(nums[i - 1])
          && nums[i] >= nums[i - 1]) { inc++; }
    }
    return inc >= nums.length - 2;
  }
  function tdLine(tb, col, ti) {
    var rows = tb.rows || [];
    var pts = [];
    rows.forEach(function (r, ri) {
      var s0 = String(r[0]).trim();
      var x = parseFloat(s0);
      if (!isFinite(x)) {
        var m = s0.match(/(?:19|20)\d{2}/);
        x = m ? parseFloat(m[0]) : ri;
      }
      var y = parseFloat(String(r[col]).replace(/[,%××\s]/g, ""));
      if (isFinite(y)) { pts.push([x, y, r]); }
    });
    if (pts.length < 2) { return tdSvg(tb, col, ti); }
    var L = 150, R = 634, top = 14, H = 300, W = 660, bot = H - 40;
    var xs = pts.map(function (p) { return p[0]; });
    var ys = pts.map(function (p) { return p[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    var y0 = Math.min(0, Math.min.apply(null, ys));
    var y1 = Math.max.apply(null, ys);
    if (x1 === x0) { x1 = x0 + 1; }
    if (y1 === y0) { y1 = y0 + 1; }
    function px(x) { return L + (x - x0) / (x1 - x0) * (R - L); }
    function py(y) { return bot - (y - y0) / (y1 - y0) * (bot - top); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%">';
    for (var g = 0; g <= 4; g++) {
      var gy = top + (bot - top) * g / 4;
      s += '<line x1="' + L + '" y1="' + gy + '" x2="' + R +
        '" y2="' + gy + '" stroke="rgba(120,130,140,.16)"/>';
      s += '<text x="' + (L - 8) + '" y="' + (gy + 4) +
        '" text-anchor="end" class="tdlab">' +
        (y1 - (y1 - y0) * g / 4).toFixed(1) + '</text>';
    }
    var line = pts.map(function (p, i) {
      return (i ? "L" : "M") + px(p[0]).toFixed(1) + " " +
        py(p[1]).toFixed(1);
    }).join(" ");
    s += '<path d="' + line + '" fill="none" stroke="#2E6F8E" ' +
      'stroke-width="2.5" stroke-dasharray="2000" ' +
      'stroke-dashoffset="0" style="animation: tdDraw 1.8s ease backwards"/>';
    s += '<polygon points="' + L + "," + bot + " " +
      pts.map(function (p) {
        return px(p[0]).toFixed(1) + "," + py(p[1]).toFixed(1);
      }).join(" ") + " " + R + "," + bot +
      '" fill="rgba(46,111,142,.10)"/>';
    pts.forEach(function (p) {
      s += '<circle cx="' + px(p[0]).toFixed(1) + '" cy="' +
        py(p[1]).toFixed(1) + '" r="3.5" fill="#2E6F8E"/>';
    });
    s += '<text x="' + (L + (R - L) / 2) + '" y="' + (H - 8) +
      '" text-anchor="middle" class="tdax">' +
      esc(String(tb.columns[col]).slice(0, 26)) + '（随 ' +
      esc(String(tb.columns[0]).slice(0, 14)) + ' 变化）</text>';
    s += '</svg>';
    return s;
  }
  function tdSvg(tb, col, ti) {
    var rows = tb.rows || [];
    var vals = rows.map(function (r) {
      return parseFloat(String(r[col]).replace(/[,%××\s]/g, ""));
    });
    var mx = 0;
    vals.forEach(function (v) {
      if (isFinite(v) && Math.abs(v) > mx) { mx = Math.abs(v); }
    });
    if (!mx) { mx = 1; }
    var L = 150, R = 634, top = 10, rowH = 34, W = 660;
    var shown = rows.slice(0, 12);
    var H = top + shown.length * rowH + 26;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%">';
    s += '<defs><linearGradient id="tdg' + ti + '" x1="0" y1="0" x2="1" y2="0">' +
      '<stop offset="0" stop-color="#2E6F8E"/><stop offset="1" stop-color="#63B3D2"/>' +
      '</linearGradient></defs>';
    for (var g = 0; g <= 4; g++) {
      var gx = L + (R - L) * g / 4;
      s += '<line x1="' + gx + '" y1="' + (top - 4) + '" x2="' + gx +
        '" y2="' + (H - 22) + '" stroke="rgba(120,130,140,.16)" stroke-width="1"/>';
    }
    shown.forEach(function (r, ri) {
      var v = vals[ri];
      var w = isFinite(v) ? Math.max(2, Math.abs(v) / mx * (R - L)) : 2;
      var y = top + ri * rowH;
      s += '<text x="' + (L - 8) + '" y="' + (y + 14) +
        '" text-anchor="end" class="tdlab">' +
        esc(String(r[0]).slice(0, 16)) + '</text>';
      s += '<rect class="tdbar" x="' + L + '" y="' + y +
        '" width="' + w.toFixed(1) + '" height="20" rx="4" fill="url(#tdg' + ti + ')"/>';
      s += '<text x="' + (L + w + 6) + '" y="' + (y + 14) +
        '" class="tdval">' + esc(String(r[col])) + '</text>';
    });
    s += '<line x1="' + L + '" y1="' + (top - 4) + '" x2="' + L +
      '" y2="' + (H - 22) + '" stroke="rgba(120,130,140,.45)" stroke-width="1"/>';
    s += '<text x="' + (L + (R - L) / 2) + '" y="' + (H - 5) +
      '" text-anchor="middle" class="tdax">' +
      esc(String(tb.columns[col]).slice(0, 26)) + '</text>';
    s += '</svg>';
    return s;
  }

  

  function mfigCard(f, i) {
    var cap = f.cap ? esc(f.cap) : ("p." + (f.page || "?") + " · " +
      (f.w || "?") + "×" + (f.h || "?"));
    var ex = f.explain
      ? '<div class="fig-explain"><b>解读</b> ' + esc(f.explain) + "</div>"
      : "";
    return '<figure class="mfig">' +
      '<img loading="lazy" src="/api/figure?file=' + FIG.file +
      '&idx=' + i + '" alt="p.' + (f.page || "?") + '">' +
      '<figcaption><span class="fkind">' +
      (f.kind === "table" ? "原表" : "原图") + "</span> " + cap +
      "</figcaption>" + ex + "</figure>";
  }

  function bindTdChips(box, tables) {
    box.querySelectorAll(".td-chip, .td-type").forEach(
      function (chip) {
        chip.addEventListener("click", function () {
          var ti = Number(chip.getAttribute("data-ti"));
          var type = chip.getAttribute("data-type");
          var c = chip.getAttribute("data-c");
          var host = box.querySelector('.td-svg[data-ti="' + ti + '"]');
          if (!host || !tables[ti]) { return; }
          var cur = host.dataset.col !== undefined
            ? Number(host.dataset.col) : null;
          var curType = host.dataset.type || "bar";
          var pick = tdPickCols(tables[ti])[0] || {c: 1};
          var newC = (c !== null && c !== undefined) ? Number(c)
            : (cur !== null ? cur : pick.c);
          var newType = type || curType;
          host.dataset.col = newC;
          host.dataset.type = newType;
          host.innerHTML = (newType === "line")
            ? tdLine(tables[ti], newC, ti)
            : tdSvg(tables[ti], newC, ti);
          box.querySelectorAll('[data-ti="' + ti + '"]').forEach(
            function (x) {
              if (x === chip) { x.classList.add("on"); }
              else if (x.classList.contains("td-chip")
                       || x.classList.contains("td-type")) {
                x.classList.remove("on");
              }
            });
        });
      });
  }

  function renderModFigs(d) {
    var figs = d.figures || [];
    var assigned = {};
    Object.keys(d.modules || {}).forEach(function (bid) {
      (d.modules[bid] || []).forEach(function (i) { assigned[i] = true; });
    });
    document.querySelectorAll(".mod-figs").forEach(function (host) {
      var bid = host.getAttribute("data-bid");
      var list = (d.modules || {})[bid] || [];
      host.innerHTML = list.map(function (i) {
        return figs[i] ? mfigCard(figs[i], i) : "";
      }).join("");
    });
    var annex = document.getElementById("figAnnexBody");
    if (annex) {
      var un = [];
      figs.forEach(function (f, i) {
        if (!assigned[i]) { un.push(mfigCard(f, i)); }
      });
      annex.innerHTML = un.length ? un.join("")
        : "<p class='empty'>全部图表都已归入上面的模块。</p>";
    }
  }

  function renderTdModules(d) {
    var tds = d.td || [];
    var byMod = d.td_modules || {};
    document.querySelectorAll(".mod-td").forEach(function (el) { el.remove(); });
    Object.keys(byMod).forEach(function (bid) {
      var host = document.querySelector('.mod-figs[data-bid="' + bid + '"]');
      if (!host) { return; }
      var sub = (byMod[bid] || []).map(function (ti) {
        return tds[ti];
      }).filter(Boolean);
      if (!sub.length) { return; }
      var el = document.createElement("div");
      el.className = "mod-td";
      el.innerHTML = renderBars(sub);
      host.appendChild(el);
      bindTdChips(el, sub);
    });
  }

  function loadTdModules() {
    fetch("/api/tabledata?file=" + FIG.file)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.state === "running") {
          if (!FIG.tdTimer) {
            FIG.tdTimer = setTimeout(function () {
              FIG.tdTimer = null;
              loadTdModules();
            }, 8000);
          }
          return;
        }
        if (d.tables && d.tables.length) {
          renderTdModules({td: d.tables, td_modules: FIG.tdModules});
        }
      })
      .catch(function () { });
  }

  function initModFigs() {
    fetch("/api/modfigs?file=" + FIG.file)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { return; }
        renderModFigs(d);
        if ((d.explain_state || "") === "running" && !FIG.timer) {
          FIG.timer = setInterval(function () {
            fetch("/api/modfigs?file=" + FIG.file)
              .then(function (r) { return r.json(); })
              .then(function (d2) {
                if (!d2.ok) { return; }
                renderModFigs(d2);

    if (v.type === "bars") {

  // 把带缩进的纯文本转成层级列表，让「分类框架」这类内容能看出结构
  // 行内 Markdown：**加粗** 与 `行内码`。在 esc 之后做替换，
    // 不会引入注入面（** 与 ` 本身已被转义规则保留为普通字符）。
  function inlineMd(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, '<code style="font-family:var(--mono);font-size:.92em">$1</code>');
  }
  function formatText(text) {
    if (!text) { return ""; }
    var lines = text.split(/\n/);
    var hasList = lines.some(function (l) { return /^\s*(\d+[.)]|[-*•])\s+/.test(l); });
    if (!hasList) {
      return text.split(/\n{2,}/).map(function (p) {
        return "<p>" + inlineMd(esc(p.trim())).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    var html = [];
    var stack = [];   // 每层的缩进宽度
    lines.forEach(function (raw) {
      if (!raw.trim()) { return; }
      var m = raw.match(/^(\s*)(\d+[.)]|[-*•])\s+(.*)$/);
      if (!m) {
        if (html.length && stack.length) {
          html[html.length - 1] = html[html.length - 1].replace(/<\/li>$/, " " + esc(raw.trim()) + "</li>");
        } else {
          html.push("<p>" + esc(raw.trim()) + "</p>");
        }
        return;
      }
      var indent = m[1].replace(/\t/g, "    ").length;
      var body = esc(m[3]);
      if (m[2].match(/^\d/)) { body = "<b>" + body + "</b>"; }

      while (stack.length && indent < stack[stack.length - 1]) {
        html.push("</li></ul>"); stack.pop();
      }
      if (!stack.length || indent > stack[stack.length - 1]) {
        html.push("<ul>"); stack.push(indent);
      } else {
        html.push("</li>");
      }
      html.push("<li>" + body);
    });
    while (stack.length) { html.push("</li></ul>"); stack.pop(); }
    return html.join("");
  }

  /* ==================== 论证链 ====================
     固定的是这个渲染引擎：怎么排版、怎么动、怎么标注差异。
     不固定的是链条本身——节点几个、什么类型、顺序如何，全由论文决定。
  */
  function chainSection() {
    var nodes = CHAIN.nodes;
    var h = ['<section class="group" id="chain">'];
    h.push('<div class="g-head"><h2>论证链</h2>');
    h.push('<span class="count">' + nodes.length + ' 个环节 · 可播放</span></div>');
    h.push('<article class="chain-card">');

    if (CHAIN.thesis) {
      h.push('<p class="chain-thesis"><b>主张</b>' + esc(CHAIN.thesis) + "</p>");
    }

    h.push('<div class="chain-rail" data-rail>' + railHTML(nodes) + "</div>");
    h.push('<div class="chain-detail" data-detail></div>');

    h.push('<div class="chain-bar">');
    h.push('<button class="cb-btn" data-act="play">▶ 播放</button>');
    h.push('<button class="cb-btn ghost" data-act="prev" aria-label="上一步">←</button>');
    h.push('<button class="cb-btn ghost" data-act="next" aria-label="下一步">→</button>');
    h.push('<div class="cb-track" data-track><div class="cb-fill" data-fill></div></div>');
    h.push('<span class="cb-count" data-count></span>');
    h.push("</div>");

    if (CHAIN.warnings && CHAIN.warnings.length) {
      h.push('<div class="chain-warn">');
      CHAIN.warnings.forEach(function (w) {
        h.push("<span>" + esc(w) + "</span>");
      });
      h.push("</div>");
    }

    h.push("</article></section>");
    return h.join("");
  }

  function railHTML(nodes) {
    var h = [];
    nodes.forEach(function (n, i) {
      h.push('<div class="cc" data-i="' + i + '" style="--c:' + typeColor(n.type) + '">');
      h.push('<div class="cc-t"><i></i>' + esc(typeLabel(n.type)) + "</div>");
      h.push('<div class="cc-l">' + esc(n.label) + "</div>");
      h.push("</div>");
      if (i < nodes.length - 1) {
        h.push('<div class="cl" data-link="' + i + '"><i></i></div>');
      }
    });
    return h.join("");
  }

  function typeLabel(t) {
    var meta = (CHAIN.types || {})[t];
    return meta ? meta.label : t;
  }

  function typeColor(t) {
    var meta = (CHAIN.types || {})[t];
    return meta ? meta.color : "#8FD2F0";
  }

  function detailHTML(n) {
    var h = ['<div class="cd-head">'];
    h.push('<span class="cd-badge" style="color:' + typeColor(n.type) + '">' +
           esc(typeLabel(n.type)) + "</span>");
    h.push('<span class="cd-title">' + esc(n.label) + "</span>");
    h.push(askBtn("n:" + n.id, true) + "</div>");

    if (n.detail) { h.push('<p class="cd-text">' + esc(n.detail) + "</p>"); }

    if (n.type === "change" && n.before && n.after) {
      h.push('<div class="delta">');
      h.push('<div class="delta-col before"><div class="delta-tag">改动前</div>' +
             diagramHTML(n.before) + "</div>");
      h.push('<div class="delta-arrow">→</div>');
      h.push('<div class="delta-col after"><div class="delta-tag">改动后</div>' +
             diagramHTML(n.after) + "</div>");
      h.push("</div>");
    } else if (n.type === "taxonomy" && n.root) {
      h.push(taxHTML(n.root));
    } else if (n.metric) {
      h.push(metricHTML(n.metric));
      if (n.before) { h.push(diagramHTML(n.before)); }
    } else if (n.before) {
      h.push(diagramHTML(n.before));
    }

    if (n.forks && n.forks.length) {
      // 分叉：这个节点分出的并行方向——独立贡献各自成卡，不再压成一条线
      h.push('<div class="forks"><div class="forks-cap">并行分支 ×' +
        n.forks.length + "</div>");
      n.forks.forEach(function (f) {
        h.push('<div class="fork-card"><b>' + esc(f.label) + "</b>");
        if (f.detail) { h.push('<span>' + esc(f.detail) + "</span>"); }
        h.push("</div>");
      });
      h.push("</div>");
    }

    if (n.evidence && n.evidence.length) {
      var ev = n.evidence[0];
      h.push('<div class="cd-ev"><b>' + esc(locatorOf(ev)) + "</b>");
      h.push("<span>" + esc(trunc(ev.quote, 170)) + "</span>");
      if (ev.quote_zh && ev.quote_zh !== ev.quote) {
        h.push('<span class="zh">' + esc(trunc(ev.quote_zh, 170)) + "</span>");
      }
      h.push("</div>");
    }
    return h.join("");
  }

  function diagramHTML(spec) {
    if (!spec) { return ""; }
    var cap = spec.label ? '<div class="dg-cap">' + esc(spec.label) + "</div>" : "";

    if (spec.kind === "tokens") {
      var n = Math.max(1, Math.min(12, Number(spec.n) || 4));
      var cadence = Number(spec.cadence);
      if (!isFinite(cadence) || cadence <= 0) { cadence = 1; }
      var h = ['<div class="dg">'];
      for (var i = 0; i < n; i++) {
        // 用间隔象征节奏：cadence 越大，点亮越慢。速度差异因此「看得见」。
        var delay = (i * cadence * 0.13).toFixed(2);
        h.push('<span class="dg-tk" style="--d:' + delay + '"></span>');
      }
      h.push("</div>");
      return cap + h.join("");
    }

    if (spec.kind === "bars") {
      var items = spec.items || [];
      var max = 0;
      items.forEach(function (it) {
        max = Math.max(max, Math.abs(Number(it.value) || 0));
      });
      max = max || 1;
      var hb = ["<div class=\"dg-bars\">"];
      items.forEach(function (it) {
        var v = Number(it.value) || 0;
        var pct = Math.round((Math.abs(v) / max) * 100);
        hb.push('<div class="dg-bar"><span>' + esc(it.label || "") + "</span>");
        hb.push('<span class="dg-track"><span class="dg-fill" style="--w:' +
                pct + '%"></span></span>');
        hb.push('<span class="dg-val">' + esc(String(it.value)) + "</span></div>");
      });
      hb.push("</div>");
      return cap + hb.join("");
    }

    if (spec.kind === "blocks") {
      var list = spec.items || [];
      var hl = typeof spec.highlight === "number" ? spec.highlight : -1;
      var hbl = ['<div class="dg-blocks">'];
      list.forEach(function (it, k) {
        hbl.push('<div class="dg-bl' + (k === hl ? " hl" : "") + '">' +
                 esc(it) + "</div>");
      });
      hbl.push("</div>");
      return cap + hbl.join("");
    }

    return cap + '<p class="dg-text">' + esc(spec.text || "") + "</p>";
  }

  function metricHTML(m) {
    var raw = String(m.value == null ? "" : m.value);
    var num = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    var h = ['<div class="metric">'];
    h.push('<span class="metric-n" data-to="' + (isFinite(num) ? num : "") +
           '">' + esc(raw) + "</span>");
    if (m.unit) { h.push('<span class="metric-u">' + esc(m.unit) + "</span>"); }
    if (m.label) { h.push('<span class="metric-l">' + esc(m.label) + "</span>"); }
    h.push("</div>");
    return h.join("");
  }

  function taxHTML(root) {
    var h = ['<div class="cd-tax">'];
    (function walk(node, d) {
      if (!node || !node.name) { return; }
      h.push('<div class="ct" data-d="' + d + '"><span class="ct-dot"></span>');
      h.push('<span class="ct-n">' + esc(node.name) + "</span>");
      if (node.what) { h.push('<span class="ct-w">' + esc(node.what) + "</span>"); }
      h.push("</div>");
      var kids = node.children || [];
      if (kids.length) {
        h.push('<div class="ct-kids">');
        kids.forEach(function (c) { walk(c, d + 1); });
        h.push("</div>");
      }
    })(root, 0);
    h.push("</div>");
    return h.join("");
  }

  // 数字滚动：只有能解析成数字的才动，否则原样显示
  function animateNumber(el) {
    var finalText = el.textContent;
    var target = parseFloat(el.getAttribute("data-to"));
    if (!isFinite(target)) { return; }
    // 先落盘正确值：万一 rAF 被节流（后台标签页、无头截图），
    // 界面上也不能留一个错了的数字
    el.textContent = finalText;
    var dot = finalText.indexOf(".");
    var decimals = dot >= 0 ? (finalText.length - dot - 1) : 0;
    var t0 = null;
    function frame(t) {
      if (t0 === null) { t0 = t; }
      var p = Math.min(1, (t - t0) / 700);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals);
      if (p < 1) { requestAnimationFrame(frame); }
    }
    requestAnimationFrame(frame);
    // 兜底：动画停摆也必须回到正确值
    setTimeout(function () { el.textContent = finalText; }, 820);
  }

  function initChain() {
    if (!CHAIN || !CHAIN.nodes || !CHAIN.nodes.length) { return; }
    var card = document.querySelector(".chain-card");
    if (!card) { return; }

    var rail = card.querySelector("[data-rail]");
    var detail = card.querySelector("[data-detail]");
    var fill = card.querySelector("[data-fill]");
    var count = card.querySelector("[data-count]");
    var playBtn = card.querySelector('[data-act="play"]');
    var track = card.querySelector("[data-track]");
    var total = CHAIN.nodes.length;
    var st = { i: 0, timer: null, auto: false };

    function dwellFor(node) {
      if (node.type === "change") { return 3200; }
      if (node.type === "effect") { return 2400; }
      if (node.type === "taxonomy") { return 2600; }
      return 1800;
    }

    function paint(run) {
      var idx = st.i;
      Array.prototype.forEach.call(rail.querySelectorAll(".cc"), function (el) {
        var k = Number(el.getAttribute("data-i"));
        el.classList.toggle("is-active", k === idx);
        el.classList.toggle("is-done", k < idx);
      });
      Array.prototype.forEach.call(rail.querySelectorAll(".cl"), function (el) {
        var k = Number(el.getAttribute("data-link"));
        el.classList.toggle("on", k < idx);
        el.classList.toggle("flow", k === idx);
      });

      detail.innerHTML = detailHTML(CHAIN.nodes[idx]);
      if (run) {
        // 重跑 CSS 动画必须先把类摘掉并强制重排，否则浏览器认为没变化
        detail.classList.remove("run");
        void detail.offsetWidth;
        detail.classList.add("run");
      }

      var num = detail.querySelector(".metric-n");
      if (num) { animateNumber(num); }

      fill.style.width = ((idx + 1) / total * 100) + "%";
      count.textContent = (idx + 1) + " / " + total;
      playBtn.textContent = st.timer
        ? "⏸ 暂停"
        : (idx >= total - 1 ? "↻ 重播" : "▶ 播放");
    }

    function stop() {
      if (st.timer) { clearTimeout(st.timer); st.timer = null; }
    }

    function schedule() {
      st.timer = setTimeout(function () {
        if (st.i < total - 1) {
          st.i += 1;
          paint(true);
          schedule();
        } else {
          stop();
          paint(false);
        }
      }, dwellFor(CHAIN.nodes[st.i]));
    }

    function play() {
      if (st.timer) { stop(); paint(false); return; }
      if (st.i >= total - 1) { st.i = 0; }
      paint(true);
      schedule();
    }

    function go(n) {
      stop();
      st.i = Math.max(0, Math.min(total - 1, n));
      paint(true);
    }

    card.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act]");
      if (btn) {
        var act = btn.getAttribute("data-act");
        if (act === "play") { play(); }
        else if (act === "next") { go(st.i + 1); }
        else if (act === "prev") { go(st.i - 1); }
        return;
      }
      if (track && track.contains(e.target)) {
        var rect = track.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / Math.max(rect.width, 1);
        go(Math.round(ratio * (total - 1)));
        return;
      }
      var cc = e.target.closest(".cc");
      if (cc) { go(Number(cc.getAttribute("data-i"))); }
    });

    paint(false);

    // 第一次滚到这里时自动播一遍：动起来比一个静止的流程图有说服力得多。
    // 只自动播一次，之后完全交给用户。
    if (typeof IntersectionObserver === "function") {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting && !st.auto) {
            st.auto = true;
            io.disconnect();
            // 留一点时间让人先读到「主张」，再开始动
            setTimeout(play, 900);
          }
        });
      }, { threshold: 0.55 });
      io.observe(card);
    }
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 证据摘录在卡片里放不下全句，截断但要留出省略号，别让人以为是原文结尾
  function trunc(s, n) {
    s = String(s || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function initNetwork() {
    var N = D.network;
    var box = document.getElementById("netViz");
    if (!box || !N || !N.nodes || !N.nodes.length) { return; }

    var W = 940, H = 560, cx = W / 2, cy = H / 2;
    var cited = N.nodes.filter(function (n) { return n.kind === "cited"; });
    var citing = N.nodes.filter(function (n) { return n.kind === "citing"; });
    // 右叶是时间线：早的靠近底部（过去侧），新的越靠上
    citing.sort(function (x, y) { return (x.year || 0) - (y.year || 0); });
    var maxC = 1;
    N.nodes.forEach(function (n) { if (n.cited_by > maxC) { maxC = n.cited_by; } });

    // 半径：相关度越高越靠近中心（92–240）
    function ringR(n) { return 92 + 148 * (1 - Math.min(n.relevance, 1)); }
    // 节点大小：被引数的对数缩放（4.5–15）
    function dotR(n) {
      return 4.5 + 10.5 * Math.log10(n.cited_by + 1) / Math.log10(maxC + 1);
    }
    // 颜色：相关度 0 → 浅灰蓝，1 → 深青
    function color(rel) {
      rel = Math.max(0, Math.min(rel, 1));
      return "hsl(203," + Math.round(22 + 40 * rel) + "%," +
             Math.round(78 - 40 * rel) + "%)";
    }

    function place(nodes, start, end) {
      var n = nodes.length;
      nodes.forEach(function (n2, i) {
        var a = (n === 1) ? (start + end) / 2 : start + (end - start) * i / (n - 1);
        var rad = a * Math.PI / 180;
        n2._x = cx + ringR(n2) * Math.cos(rad);
        n2._y = cy - ringR(n2) * Math.sin(rad);
      });
    }
    place(cited, 105, 255);     // 左半圆（过去）；两端各留 10° 缝隙，
    place(citing, -75, 75);     // 右半圆（未来）——否则高相关节点挤在中心正上/下

    var s = ['<svg class="net-svg" viewBox="0 0 ' + W + " " + H + '">'];

    s.push('<text class="net-leaf" x="' + (cx - 265) + '" y="' + (cy - 218) + '">\u2190 \u5b83\u5f15\u7528\u7684 \u00b7 \u8fc7\u53bb</text>');
    s.push('<text class="net-leaf" x="' + (cx + 265) + '" y="' + (cy - 218) + '">\u5f15\u7528\u5b83\u7684 \u00b7 \u672a\u6765 \u2192</text>');

    s.push('<g class="net-center">');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="#2E6F8E" opacity=".12"/>');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#2E6F8E"/>');
    var ct = esc(trunc((N.center && N.center.title) || "本文", 26));
    s.push('<text x="' + cx + '" y="' + (cy + 52) + '">' + ct + "</text>");
    s.push("</g>");

    N.nodes.forEach(function (n, i) {
      var mx = (cx + n._x) / 2, my = (cy + n._y) / 2;
      var dx = n._x - cx, dy = n._y - cy, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var bow = 26;
      var qx = mx - dy / len * bow, qy = my + dx / len * bow;
      s.push('<path id="ne' + i + '" class="net-edge" d="M' + cx + " " + cy +
             " Q" + qx + " " + qy + " " + n._x + " " + n._y + '"/>');
    });

    N.nodes.forEach(function (n, i) {
      var r = dotR(n);
      s.push('<g class="net-node" data-ni="' + i + '">');
      s.push('<circle cx="' + n._x.toFixed(1) + '" cy="' + n._y.toFixed(1) +
             '" r="' + r.toFixed(1) + '" fill="' + color(n.relevance) + '"/>');
      var label = String(n.year || "");
      if (label) {
        // 年份放在节点**外侧**（沿半径外推），不压在圆上、不与邻点重叠
        var wdx = n._x - cx, wdy = n._y - cy;
        var wlen = Math.sqrt(wdx * wdx + wdy * wdy) || 1;
        var tx = n._x + wdx / wlen * (r + 12);
        var ty = n._y + wdy / wlen * (r + 12) + 3;
        s.push("<text x=\"" + tx.toFixed(1) + "\" y=\"" + ty.toFixed(1) +
               '" text-anchor="middle">' + esc(label) + "</text>");
      }
      s.push("<title>" + esc(trunc(n.title, 90)) + " · 相关度 " +
             Math.round(n.relevance * 100) + "% · 被引 " + n.cited_by + "</title>");
      s.push("</g>");
    });

    s.push("</svg>");
    box.innerHTML = s.join("");

    function show(n) {
      var d = document.getElementById("netDetail");
      var src = n.origin === "openalex" ? "OpenAlex" : "本文参考文献列表（PDF）";
      var doi = n.doi
        ? ' · <a href="https://doi.org/' + esc(n.doi) + '" target="_blank" rel="noopener">DOI: ' +
          esc(n.doi) + "</a>"
        : "";
      var pct = Math.round(n.relevance * 100);
      var h = ['<div class="net-d-top">'];
      if (n.title_zh) {
        // 中文是机翻（呈现层），节点身份与元数据仍全部来自数据库
        h.push('<span class="net-d-title">' + esc(n.title_zh) + "</span>");
        h.push('<span class="net-d-title-zh">' + esc(n.title) + "</span>");
      } else {
        h.push('<span class="net-d-title">' + esc(n.title) + "</span>");
      }
      h.push('<span class="net-badge ' + n.kind + '">' +
             (n.kind === "cited" ? "本文引用" : "引用本文") + "</span>");
      h.push("</div>");
      h.push('<div class="net-d-meta">' +
        [n.year || null, esc(n.venue || ""), "被引 " + n.cited_by + " 次", doi]
          .filter(Boolean).join(" · ") + "</div>");

      if (n.topics && n.topics.length) {
        h.push('<div class="net-d-topics">');
        n.topics.forEach(function (tp) {
          var parts = [tp.field_zh || tp.field,
                       tp.subfield_zh || tp.subfield, tp.name];
          var label = parts.filter(Boolean).join(" · ");
          h.push('<span class="topic-tag">' + esc(label) + "</span>");
        });
        h.push("</div>");
      }

      h.push('<div class="net-d-score"><span class="net-d-label">与本文相关度</span>' +
        '<span class="net-d-bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="net-d-pct">' + pct + "%</span></div>");
      h.push('<div class="net-d-reasons">' + n.reasons.map(function (r) {
        return "· " + esc(r);
      }).join("<br>") + "</div>");
      h.push('<div class="net-d-note"><b>✓ 数据来源：' + esc(src) +
        '。</b>节点与被引数为数据库实录，非模型生成；' +
        "相关度为基于共引与关键词的计算值，依据如上。</div>");
      d.innerHTML = h.join("");
      d.classList.add("show");
    }

    var svg = box.querySelector("svg");
    svg.addEventListener("click", function (e) {
      var g = e.target.closest(".net-node");
      if (!g) { return; }
      var i = Number(g.getAttribute("data-ni"));
      show(N.nodes[i]);
      Array.prototype.forEach.call(svg.querySelectorAll(".net-edge.hot"),
        function (el) { el.classList.remove("hot"); });
      var edge = svg.querySelector("#ne" + i);
      if (edge) { edge.classList.add("hot"); }
    });

    // 检索关键词：点击复制。clipboard API 在 file:// 下可能受限，留 execCommand 兜底。
    var kwBox = document.getElementById("ncKws");
    if (kwBox) {
      function fallbackCopy(txt) {
        var ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e2) {}
        document.body.removeChild(ta);
      }
      function copyText(txt, el) {
        var done = function () {
          var old = el.textContent;
          el.textContent = "已复制 ✓";
          setTimeout(function () { el.textContent = old; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done,
            function () { fallbackCopy(txt); done(); });
        } else { fallbackCopy(txt); done(); }
      }
      kwBox.addEventListener("click", function (e) {
        var b = e.target.closest(".kw-chip");
        if (!b) { return; }
        if (b.id === "ncKwAll") {
          var all = Array.prototype.map.call(
            kwBox.querySelectorAll(".kw-chip:not(.all)"),
            function (x) { return x.getAttribute("data-kw"); }
          ).join(", ");
          copyText(all, b);
        } else {
          copyText(b.getAttribute("data-kw") || "", b);
        }
      });
    }
  }

  // ======================= 追问这篇论文 =======================
  // 静态打开时 window.__PA_SERVE__ 是 null，按钮会显示「未连接」并给出命令；
  // 由 paperatomy serve 提供页面时，服务端会把它替换成实际端口。
  var ASK_CFG = window.__PA_SERVE__ || null;
  var ASK = { ctx: [], history: [], busy: false, live: false };

  var askPanel = document.getElementById("askPanel");
  var askLog = document.getElementById("askLog");
  var askText = document.getElementById("askText");
  var askSend = document.getElementById("askSend");
  var askSub = document.getElementById("askSub");
  var askCtx = document.getElementById("askCtx");
  var askFab = document.getElementById("askFab");

  // 出处坐标：和 Markdown、命令行完全一致（这里必须是同一套规则，
  // 否则同一份报告换个地方看就对不上了）
  function locatorOf(e) {
    var parts = [];
    if (e.section_no) { parts.push("§" + e.section_no); }
    if (e.para) { parts.push("第 " + e.para + " 段"); }
    if (e.page) { parts.push("p." + e.page); }
    return parts.join(" · ") || "出处未标注";
  }

  function evHTML(list) {
    var ok = list.filter(function (e) { return e.verified !== false; });
    var bad = list.filter(function (e) { return e.verified === false; });
    var h = ['<div class="ev"><div class="ev-title">原文依据</div>'];
    ok.forEach(function (e) {
      h.push('<div class="ev-item"><div class="ev-loc">');
      h.push('<span class="chip">' + esc(locatorOf(e)) + "</span>");
      if (e.section) {
        // 章节标题去掉编号前缀，否则和左边的 §4 重复
        h.push('<span class="sec">' +
          esc(e.section.replace(/^\s*\d{1,2}(?:\.\d{1,2}){0,2}[\s.]+/, "")) +
          "</span>");
      }
      h.push("</div>");
      h.push('<div class="ev-src">' + esc(e.quote) + "</div>");
      if (e.quote_zh && e.quote_zh !== e.quote) {
        h.push('<div class="ev-zh">' + esc(e.quote_zh) + "</div>");
      }
      h.push("</div>");
    });
    if (bad.length) {
      // 定位失败的条目不是原文——如实降级为「模型转述」，
      // 不再显示 §坐标（那本来就是模型自报、程序无法背书的）
      h.push('<div class="ev-title" style="color:var(--warn)">'
        + '⚠ 以下 ' + bad.length + ' 条未能定位到原文原话——是模型转述，不是原文，不可作为引用</div>');
      bad.forEach(function (e) {
        h.push('<div class="ev-item"><div class="ev-loc">'
          + '<span class="raw">模型转述 · 未经原文核实</span></div>');
        h.push('<div class="ev-src" style="opacity:.75">' + esc(e.quote) + "</div>");
        if (e.quote_zh && e.quote_zh !== e.quote) {
          h.push('<div class="ev-zh" style="opacity:.75">' + esc(e.quote_zh) + "</div>");
        }
        h.push("</div>");
      });
    }
    h.push("</div>");
    return h.join("");
  }

  function askBtn(key, dark) {
    return '<button class="ask-btn' + (dark ? " dark" : "") + '" type="button" data-ask="' +
      esc(key) + '" title="把这块内容加入追问"><svg viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
      '<path d="M12 5v14M5 12h14"/></svg>追问</button>';
  }

  // 把一块内容压成纯文本交给模型。带上是哪一段、原文怎么说的，
  // 模型才知道「这个」指什么。
  function askPayload(key) {
    if (key.indexOf("b:") === 0) {
      var bid = key.slice(2);
      var found = null;
      D.groups.forEach(function (g) {
        g.blocks.forEach(function (b) { if (b.id === bid) { found = b; } });
      });
      if (!found && hero && hero.id === bid) { found = hero; }
      if (!found) { return null; }
      var text = found.content || "";
      (found.evidence || []).forEach(function (e) {
        text += "\n依据［" + locatorOf(e) + "］" + e.quote +
                (e.quote_zh && e.quote_zh !== e.quote ? "\n译文：" + e.quote_zh : "");
      });
      return { key: key, title: found.title, text: text };
    }
    if (key.indexOf("n:") === 0 && CHAIN) {
      var nid = key.slice(2);
      var node = null;
      (CHAIN.nodes || []).forEach(function (n) { if (n.id === nid) { node = n; } });
      if (!node) { return null; }
      var t = "［" + typeLabel(node.type) + "］" + node.label;
      if (node.detail) { t += "\n" + node.detail; }
      if (node.metric) {
        t += "\n指标：" + node.metric.value + (node.metric.unit || "") +
             "（" + (node.metric.label || "") + "）";
      }
      (node.evidence || []).forEach(function (e) {
        t += "\n依据［" + locatorOf(e) + "］" + e.quote +
             (e.quote_zh && e.quote_zh !== e.quote ? "\n译文：" + e.quote_zh : "");
      });
      return { key: key, title: node.label, text: t };
    }
    return null;
  }

  function renderChips() {
    askCtx.innerHTML = ASK.ctx.map(function (c, i) {
      return '<span class="ctx-chip"><span>' + esc(c.title) + "</span>" +
        '<button type="button" data-drop="' + i + '" aria-label="移除">×</button></span>';
    }).join("");
    askFab.classList.toggle("has-ctx", ASK.ctx.length > 0);
  }

  function openAsk() {
    askPanel.classList.add("open");
    askPanel.setAttribute("aria-hidden", "false");
    if (ASK.live) { setTimeout(function () { askText.focus(); }, 120); }
  }
  function closeAsk() {
    askPanel.classList.remove("open");
    askPanel.setAttribute("aria-hidden", "true");
  }

  function addContext(key) {
    var item = askPayload(key);
    if (!item) { openAsk(); return; }
    var dup = false;
    ASK.ctx.forEach(function (c) { if (c.key === key) { dup = true; } });
    if (!dup) { ASK.ctx.push(item); }
    renderChips();
    openAsk();
  }

  function hideHint() {
    var h = askLog.querySelector(".ask-hint");
    if (h) { h.remove(); }
  }

  function pushMsg(role, text) {
    var node = document.createElement("div");
    node.className = "msg " + (role === "user" ? "user" : "bot");
    if (role === "user") {
      node.textContent = text;
    } else {
      node.innerHTML = '<div class="who">paperatomy</div><div class="body"></div>';
      node.querySelector(".body").innerHTML = formatText(text);
    }
    askLog.appendChild(node);
    askLog.scrollTop = askLog.scrollHeight;
    return node;
  }

  function showError(msg) {
    var node = document.createElement("div");
    node.className = "msg err";
    node.textContent = msg;
    askLog.appendChild(node);
    askLog.scrollTop = askLog.scrollHeight;
  }

  function send(question) {
    if (ASK.busy || !ASK.live) { return; }
    var q = (question || askText.value || "").trim();
    if (!q) { return; }

    askText.value = "";
    askText.style.height = "auto";
    hideHint();

    pushMsg("user", q);
    ASK.history.push({ role: "user", content: q });

    var ctx = ASK.ctx.map(function (c) { return { title: c.title, text: c.text }; });
    ASK.ctx = [];
    renderChips();

    var bubble = pushMsg("bot", "").querySelector(".body");
    var caret = document.createElement("span");
    caret.className = "caret";
    bubble.appendChild(caret);

    ASK.busy = true;
    askSend.disabled = true;

    var answer = "";
    var painted = Date.now();

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q,
        context: ctx,
        history: ASK.history.slice(-8, -1)
      })
    }).then(function (res) {
      if (!res.ok || !res.body) { throw new Error("HTTP " + res.status); }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      // 增量是逐 token 来的，每来一个就重排会卡。
      // 攒到 70ms 才画一次，结束时无论如何再画一遍——
      // 「最终值必须由确定的一步给出」，这条上一版在数字滚动上踩过。
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) { return; }
          buffer += decoder.decode(chunk.value, { stream: true });
          var blocks = buffer.split("\n\n");
          buffer = blocks.pop();
          blocks.forEach(function (raw) {
            raw.split("\n").forEach(function (line) {
              if (line.indexOf("data:") !== 0) { return; }
              var obj;
              try { obj = JSON.parse(line.slice(5).trim()); } catch (err) { return; }
              if (obj.delta) {
                answer += obj.delta;
                if (Date.now() - painted > 70) {
                  painted = Date.now();
                  bubble.innerHTML = formatText(answer);
                }
              }
              if (obj.error) { showError(obj.error); }
            });
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      showError("连不上本地服务：" + (err && err.message ? err.message : err));
    }).then(function () {
      if (caret.parentNode) { caret.remove(); }
      if (answer) {
        bubble.innerHTML = formatText(answer);
        ASK.history.push({ role: "assistant", content: answer });
      }
      ASK.busy = false;
      askSend.disabled = false;
      askLog.scrollTop = askLog.scrollHeight;
    });
  }

  function initAsk() {
    if (!ASK_CFG) {
      askFab.classList.add("offline");
      askSub.textContent = "未连接本地服务";
      askText.disabled = true;
      askSend.disabled = true;
      askText.placeholder = "需要在本地运行 paperatomy serve";
      // offline 先渲染历史（若有），再补「怎么连服务」的提示——
      // 历史是报告里的数据，静态打开也该能看到
      if (renderQaHistory()) {
        var off = document.createElement("div");
        off.className = "ask-hint";
        off.innerHTML = "<br><b>继续追问需要本地服务。</b><br>" +
          "在终端里跑 paperatomy serve out/报告.json 后刷新本页。";
        askLog.appendChild(off);
        return;
      }
      askLog.innerHTML =
        '<div class="ask-hint"><b>提问需要本地服务。</b><br>' +
        "这份报告是静态文件：它没有模型凭据，也不会替你花钱。在终端里跑——" +
        '<div style="font-family:var(--mono);font-size:12px;background:#fff;' +
        'border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:9px">' +
        "paperatomy serve out/报告.json" + "</div>" +
        "然后打开它给出的地址，这个按钮就能用了。报告里的证据定位、中英对照不用服务也能看。</div>";
      return;
    }
    ASK.live = true;
    askSub.innerHTML = "<b>●</b> 已连接 · 只依据这篇论文";
    askText.disabled = false;
    askSend.disabled = false;
    askLog.scrollTop = askLog.scrollHeight;
  }

  // 历史问答回放：数据在报告 JSON 里，serve 保存，重开不丢。
  // 只读展示，不依赖服务——静态打开也能看。
  function renderQaHistory() {
    if (!D.qa || !D.qa.length) { return false; }
    askLog.innerHTML =
      '<div class="ask-hint">以下是之前的 ' + D.qa.length +
      " 条问答（存在报告里，换次打开还在）：</div>";
    D.qa.forEach(function (m) {
      pushMsg("user", m.question);
      var b = pushMsg("bot", "");
      b.querySelector(".body").innerHTML = formatText(m.answer || "");
    });
    var tip = document.createElement("div");
    tip.className = "ask-hint";
    tip.innerHTML = "<br><b>报告先回答了「一般读者会问什么」。</b><br>" +
      "剩下的疑问在这里问。答案只从这篇论文的材料里来，找不到它会说找不到。" +
      '<a class="ask-eg" data-q="这篇论文最核心的贡献是什么？用三句话说清。">' +
      "试试：核心贡献是什么</a>";
    askLog.appendChild(tip);
    return true;
  }
  renderQaHistory();

  askFab.addEventListener("click", function () {
    if (askPanel.classList.contains("open")) { closeAsk(); } else { openAsk(); }
  });
  askClose.addEventListener("click", closeAsk);
  askSend.addEventListener("click", function () { send(); });

  askText.addEventListener("keydown", function (e) {
    // Enter 发送、Shift+Enter 换行——聊天框的通用约定
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  askText.addEventListener("input", function () {
    askText.style.height = "auto";
    askText.style.height = Math.min(askText.scrollHeight, 132) + "px";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && askPanel.classList.contains("open")) { closeAsk(); }
  });

  // 全部走委托：卡片是 innerHTML 生成的，逐个绑定会漏
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-ask]");
    if (btn) {
      e.preventDefault();
      e.stopPropagation();   // 否则会触发卡片折叠
      addContext(btn.getAttribute("data-ask"));
      return;
    }
    var drop = e.target.closest("[data-drop]");
    if (drop) {
      e.stopPropagation();
      ASK.ctx.splice(Number(drop.getAttribute("data-drop")), 1);
      renderChips();
      return;
    }
    var eg = e.target.closest("[data-q]");
    if (eg) {
      e.preventDefault();
      send(eg.getAttribute("data-q"));
    }
  });

  initAsk();

  // 工作台打开的报告：顶部显眼返回 + 左下角备用入口
  if (window.__PA_SERVE__ && window.__PA_SERVE__.mode === "workbench") {
    var backFab = document.getElementById("backFab");
    backFab.classList.add("show");
    backFab.addEventListener("click", function () {
      location.href = "/";
    });
    var backTop = document.createElement("a");
    backTop.className = "back-top";
    backTop.href = "/";
    backTop.textContent = "← 返回工作台";
    backTop.classList.add("show");
    document.body.appendChild(backTop);

    // 对照原文 / 图表速览：报告对应 PDF 存在时才提供
    var PDF = window.__PA_SERVE__.pdf;
    if (PDF) {
      var btns = document.createElement("div");
      btns.className = "side-btns";
      btns.innerHTML = '<button id="btnOrig">对照原文</button>' +
        '<button id="btnDemo">动态讲解</button>';
      document.body.appendChild(btns);
      btns.classList.add("show");

      var panel = document.createElement("div");
      panel.className = "side-panel";
      panel.innerHTML = '<div class="sp-head"><span id="spCap"></span>' +
        '<button id="spClose" style="border:none;background:none;cursor:pointer;' +
        'font-size:16px;color:inherit">×</button></div>' +
        '<div class="sp-body" id="spBody"></div>';
      document.body.appendChild(panel);
      // 按钮绑定（v0.9.6 图表 v3 拼接时被误删，导致面板点不开——回归测试已锁）
      document.getElementById("btnOrig").addEventListener("click",
        function () { toggle("orig"); });
      document.getElementById("btnDemo").addEventListener("click",
        function () { toggle("demo"); });
      document.getElementById("spClose").addEventListener("click",
        function () { closePanel(); });
      panel.dataset.bound = "3";   // 诊断用：3 个按钮绑定完成

      var cur = "";
      // 深链：#orig 直达对照原文；#td/#figs 落到附图区（v0.11.0）
      if (location.hash === "#td" || location.hash === "#figs") {
        // v0.11.0 图已进模块，老深链落到文末附图区
        setTimeout(function () {
          var a = document.getElementById("figAnnex");
          if (a) { a.open = true; a.scrollIntoView({behavior: "smooth"}); }
        }, 1500);
      }
      if (location.hash === "#demo") {
        setTimeout(function () {
          var b = document.getElementById("btnDemo");
          if (b) { b.click(); }
        }, 300);
      }
      if (location.hash === "#orig") {
        setTimeout(function () {
          var b = document.getElementById("btnOrig");
          if (b) { b.click(); }
        }, 300);
      }
      function closePanel() {
        panel.classList.remove("open");
        document.body.classList.remove("with-side");
        document.getElementById("btnOrig").classList.remove("on");
        document.getElementById("btnDemo").classList.remove("on");
        DEMO.playing = false;
        if (DEMO.timer) { clearInterval(DEMO.timer); DEMO.timer = null; }
        cur = "";
      }
      function toggle(which) {  // orig | demo
        if (which !== "orig" && which !== "demo") { return; }
        if (cur === which) { closePanel(); return; }
        cur = which;
        panel.classList.add("open");
        document.body.classList.add("with-side");
        document.getElementById("btnOrig").classList.toggle("on",
          which === "orig");
        document.getElementById("btnDemo").classList.toggle("on",
          which === "demo");
        var body = document.getElementById("spBody");
        var cap = document.getElementById("spCap");
        if (which === "orig") {
          cap.textContent = "论文原文（渲染自 PDF）";
          fetch("/api/pdfinfo?file=" + encodeURIComponent(__PA_SERVE__.report))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d.available) { body.textContent = "找不到对应 PDF。"; return; }
              var h = [];
              for (var i = 1; i <= d.pages; i++) {
                h.push('<img loading="lazy" src="/pageimg/' +
                  encodeURIComponent(PDF.replace(/\.pdf$/, "")) + "/" + i +
                  '.png" alt="第 ' + i + ' 页">');
                h.push('<div class="pno">第 ' + i + " 页 / 共 " + d.pages + " 页</div>");
              }
              body.innerHTML = h.join("");
            })
            .catch(function (e) { body.textContent = "加载失败：" + e; });
        } else {
          cap.textContent = "动态讲解（模型生成分镜）";
          initDemo(body);
        }
      }
    }
  }

  // 打开 http://127.0.0.1:8770/#ask 直接展开面板，省一次点击
  if (location.hash === "#ask" && ASK.live) { openAsk(); }

})();
</script>
<script>
  window.__PA_ERR_SHOW = function () {
    var b = document.getElementById("pa-err-badge");
    if (!b) {
      b = document.createElement("div");
      b.id = "pa-err-badge";
      b.style.cssText = "position:fixed;left:10px;bottom:64px;z-index:999;" +
        "max-width:420px;background:#B4432A;color:#fff;font-size:12px;" +
        "padding:8px 12px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.3)";
      document.body.appendChild(b);
    }
    b.textContent = "⚠ 页面脚本出错：" + window.__PA_ERR +
      "（可截图反馈，或点工作台「诊断与修复」）";
  };
  if (window.__PA_ERR) { window.__PA_ERR_SHOW(); }
  </script>
  </body>
