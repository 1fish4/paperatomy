nd of 2023, there are only a few major players capable of training and deploying the state-of-the-art FMs, who thereby have powerful control over the public and can potentially manipulate them in a way they prefer."},{"page":4,"quote":"The attention mechanism in large FMs faces significant computational bottlenecks primarily due to its quadratic complexity."},{"page":10,"quote":"Pre-training for large FMs relies on a substantial amount of computation resources. For instance, GPT-3-175B consumes 3.14×10^23 FLOPs and LLaMA-70B takes 1.7×10^6 GPU hours."},{"page":18,"quote":"Compared to traditional DNNs, LLMs exhibit a higher frequency of activation outliers, which are crucial for maintaining model accuracy. Standard quantization often removes these outliers, leading to a significant performance drop."}]}]},{"name":"框架","blocks":[{"id":"taxonomy","title":"分类框架","content":"作者按“架构→算法→系统”三层组织，每层再细分。\n\n一、资源高效架构（第3节）：\n1. 高效注意力：稀疏注意力（Longformer、ETC、BIGBIRD、HEPOS、MATE、TDANet）；近似注意力（Linformer、Reformer、Katharopoulos等、Polysketchformer、Mega、Deformable Attention、CrossViT）；无注意力方法（Hyena、SSM/Mamba、Recurrent-Style Transformers、RWKV、RetNet）。\n2. 动态神经网络：Mixture-of-Experts（Switch Transformer、GLaM、V-MoE、LIMoE、Mistral1、MoEfication、Sparse upcycling、FFF）；Early Exiting（He et al.等）。\n3. 扩散模型优化：高效扩散（DDIM、PNDM、DPM-Solver）；潜空间扩散（LDM/Stable Diffusion、LD-ZNet、SALAD）；扩散架构变体（SnapFusion、ScaleCrafter、ERNIE-ViLG、Mobile diffusion）。\n4. ViT专用优化（LeViT、MobileViT、EfficientFormer、EfficientViT、FastViT、LightViT、EdgeViT）。\n\n二、资源高效算法（第4节，按生命周期分）：\n1. 预训练算法：训练数据质量控制（DataComp、DFN、DataCompDR）、训练数据缩减（去重、图像块移除：TRIPS、MAE、MixMAE、COPA、PatchDropout）、渐进学习（Stacking BERT、CompoundGrow、Staged training、Knowledge inheritance、AutoProg、LiGO）、混合精度训练（Mesa、GACT）。\n2. 微调算法：加性调优（Adapter tuning：ADA、MetaTroll、ST-Adapter、HiWi、AdaMix、MEFT、Residual Adapters；Prompt tuning：PromptTuning、ATTEMPT、BioInstruct、DualPL、MPrompt；Prefix tuning：UAPT、Prefix-diffusion、DOP、DAPA、PIP）；选择性调优（SAM、SmartFRZ、FiSH-DiP、Token Mixing、VL-PET）；重参数调优（LoRA及其变体：QLoRA、P  During training, RetNet demonstrates a 25-50% memory saving and a 7× acceleration compared to the standard Transformer."},{"page":13,"quote":"Yaniv et al. [141] report a 2–3× improvement in performance using speculative decoding on the T5X model, while a concurrent study [36] demonstrates similar speedups on a 70B Chinchilla model."},{"page":14,"quote":"H2O demonstrates the capability to reduce latency by up to 1.9× and increase throughput by 29×."},{"page":15,"quote":"Scissorhands utilizes an innovative compact KV cache and results in a notable reduction in KV cache inference memory usage, achieving up to a 5× reducation while maintaining model quality."},{"page":18,"quote":"GPTQ reduces the bit-width of each weight to 3 or 4 bits, allowing quantization of GPT models with 175 billion parameters with minimal accuracy loss."}]}]},{"name":"结论","blocks":[{"id":"consensus","title":"领域现状与共同前提","content":"论文未集中汇总领域共识，但从多处可归纳出以下共享前提与默认做法：(1) 大多数基础模型基于Transformer架构，其注意力二次复杂度是主要瓶颈，因此大量工作围绕降低注意力成本展开；(2) 资源效率研究普遍以不牺牲性能为前提，追求在同等精度下降低算力/内存/存储/带宽；(3) 模型压缩（剪枝、蒸馏、量化、低秩分解）是部署阶段的通用手段，其中量化因部署成本低而被广泛采用；(4) 微调阶段普遍采用参数高效微调（PEFT），LoRA被视为最流行的参数高效微调方法；(5) 系统层面普遍采用混合并行策略训练大模型，云端服务普遍关注KV cache内存管理；(6) 领域普遍承认端侧部署受内存墙和I/O限制，边云协同是常见思路。以上归纳依据分散于第3-5节及结论。","confidence":"medium","empty":false,"evidence":[{"page":4,"quote":"Since most FMs are based on transformer architecture, we briefly analyze the resource cost of it."},{"page":13,"quote":"LoRA, as the most popular parameter-efficient fine-tuning method, still exhibits performance gaps when compared to full fine-tuning."},{"page":18,"quote":"Due to its low deployment cost, PTQ is also the most easily deployable and widely applicable technique in model compression."},{"page":21,"quote":"In practice, these parallelisms are usually used in a hybrid way."},{"page":23,"quote":"Since large FMs often rely on large parameter sizes and on-device memory resources are scarce (e.g., 8GB), inferring large FMs on devices faces the challenge of “memory wall”."}]},{"id":"open","title":"开放问题与方向","content":"作者在结论中列出5条未来方向：(1) 云边混合部署：使基础模型下沉到近用户设备，实现泛在、隐私保护、高可用的通用智能；尚未解决因为模型规模与设备资源矛盾，目前仅初步将LLaMA-7B带到手机/PC，杀手级应用待探索。(2) 利用模型稀疏性：模型越大，给定任务激活比例越小，即使稠密训练的非MoE模型也存在运行时激活稀疏性；尚未解决因为需要更高效的稀疏架构（超越MoE）来利用激活稀疏性降低推理时间与内存。(3) 基础模型即服务：模型成为像Web和数据库一样的通用服务；尚未解决因为对调度、负载均衡、安全与隔离的系统基础设施提出新挑战，同时带来软硬件协同设计机会。(4) 以Agent为整体系统优化：LLM作为构建Agent的关键模块，其效率不应孤立考虑，需适配Agent工作流；尚未解决因为多模型协作存在逻辑依赖，为每个任务选择合适模型并在给定硬件上调度以最大化Agent性能的设计空间巨大。(5) 实用隐私保护基础模型：用户数据上云增加隐私担忧，现有方法包括联邦学习等；尚未解决因为隐私保护与资源效率的联合优化仍不成熟。","confidence":"high","empty":false,"evidence":[{"page":24,"quote":"(1) Cloud-edge hybrid deployment. To enable ubiquitous, privacy-preserving, and highly available general intelligence, many FMs will ultimately sink to near-user devices."},{"page":24,"quote":"(2) Exploiting the model sparsity. With model being larger, the activated ratio of model will go smaller for a given task."},{"page":24,"quote":"(3) Large FM as a service. On both clouds and devices, large FMs are unifying the DNN ecosystem [293]. Ultimately, it becomes a universal service to be invoked just as today’s Web and Database."},{"page":24,"quote":"(4) Agent as a holistic system to optimize. In the future, FMs especially LLMs will be used as a key building block for establishing agents [151, 262]."},{"page":24,"quote":"(5) Practical privacy-preserving FM. As the volume of user data uploaded to the cloud for FM processing continues to increase, the severity of privacy concerns correspondingly escalates."}]}]},{"name":"判断","blocks":[{"id":"questions","title":"值得追问的问题","content":"1. 分类框架中“架构优化”与“算法优化”存在重叠（如动态神经网络中的MoE既属架构又涉及系统训练优化，LoRA既属微调又属低秩分解压缩），作者如何保证分类互斥且完备？是否遗漏了“数据高效”这一角度（如数据选择、合成数据）？2. 综述明确排除硬件设计，但硬件感知优化（如FlightLLM、SpAtten）又被纳入系统章节，边界是否一致？排除硬件是否导致对能效（energy）这一关键资源的讨论不足？3. 结论中提出“利用模型稀疏性”作为方向，但正文对激活稀疏性的讨论仅零星提及（如PowerInfer），是否低估了稀疏性在训练和推理中的潜力？后续工作（如MoE与Mamba结合）是否已部分回应？","confidence":"low","empty":false,"evidence":[{"page":2,"quote":"We survey only algorithm and system innovations; we exclude a huge body of work at hardware design;"},{"page":21,"quote":"Some hardware-aware methods are also proposed to optimize FM."},{"page":24,"quote":"Recent literature [175] finds that even a densely trained non-MoE model exhibits runtime activation sparsity, which can be exploited to reduce inference time and memory footprint."}]}]}]}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("paper-data").textContent);

  // 每个分组一个色调，卡片左侧色条用它，视觉上能一眼分清「概览 / 框架 / 结论 / 判断」
  var GROUP_COLORS = ["#2E6F8E", "#4A9BBF", "#7A9E7E", "#B8703F"];

  document.getElementById("title").textContent = D.paper_title || "（未识别标题）";
  document.title = (D.paper_title || "论文解剖") + " · paperatomy";

  var meta = [];
  if (D.template_name) { meta.push("<span>模板 <b>" + esc(D.template_name) + "</b></span>"); }
  if (D.pages)        { meta.push("<span><b>" + D.pages + "</b> 页</span>"); }
  if (D.blocks)       { meta.push("<span><b>" + D.blocks + "</b> 个板块</span>"); }
  if (D.model)        { meta.push("<span>模型 <b>" + esc(D.model) + "</b></span>"); }
  document.getElementById("meta").innerHTML = meta.join("");

  var jump = [];
  var main = [];

  // 「一句话结论」单独抽出来做页首大卡：它是整篇最该被先看到的一句，
  // 混在卡片堆里会被淹掉。
  var hero = null;
  D.groups.forEach(function (g) {
    g.blocks = g.blocks.filter(function (b) {
      if (!hero && b.id === "tl_dr") { hero = b; return false; }
      return true;
    });
  });
  D.groups = D.groups.filter(function (g) { return g.blocks.length; });

  if (hero) {
    var hh = ['<div class="hero"><div class="label">' + esc(hero.title) + "</div>"];
    hh.push("<p>" + esc(hero.content || "论文未提及。") + "</p>");
    if (hero.evidence && hero.evidence.length) {
      hh.push('<div class="ev"><div class="ev-title">原文依据</div>');
      hero.evidence.forEach(function (e) {
        hh.push('<div class="ev-item"><span class="ev-page">' +
                esc(e.page ? "p." + e.page : "页?") + "</span>");
        hh.push('<span class="ev-quote">' + esc(e.quote) + "</span></div>");
      });
      hh.push("</div>");
    }
    hh.push("</div>");
    main.push(hh.join(""));
  }

  D.groups.forEach(function (g, gi) {
    var anchor = "g" + gi;
    jump.push('<a href="#' + anchor + '">' + esc(g.name) + "</a>");

    var gc = GROUP_COLORS[gi % GROUP_COLORS.length];
    main.push('<section class="group" id="' + anchor + '" style="--gc:' + gc + '">');
    main.push('<div class="g-head"><h2>' + esc(g.name) + "</h2>");
    main.push('<span class="count">' + g.blocks.length + " 块</span></div>");

    var single = g.blocks.length === 1;
    main.push('<div class="cards' + (single ? " single" : "") + '">');

    g.blocks.forEach(function (b, bi) {
      // 默认全部展开：这是给人读的报告，不是目录。
      // 折叠是「太长时收起来」的手段，不该是打开时的默认状态。
      var open = " open";
      main.push('<article class="card' + open + '">');
      main.push('<div class="c-head">');
      main.push('<h3>' + esc(b.title) + "</h3>");
      if (b.confidence === "low") {
        main.push('<span class="badge low">低置信</span>');
      }
      main.push('<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
                'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M6 4l4 4-4 4"/></svg>');
      main.push("</div>");

      main.push('<div class="c-body">');
      if (b.empty) {
        main.push('<div class="txt"><p class="empty">论文未提及，或材料不足未抽取到内容。</p></div>');
      } else {
        main.push('<div class="txt">' + formatText(b.content) + "</div>");
      }
      if (b.evidence && b.evidence.length) {
        main.push('<div class="ev"><div class="ev-title">原文依据</div>');
        b.evidence.forEach(function (e) {
          var page = e.page ? "p." + e.page : "页码未标注";
          main.push('<div class="ev-item"><span class="ev-page">' + esc(page) + "</span>");
          main.push('<span class="ev-quote">' + esc(e.quote) + "</span></div>");
        });
        main.push("</div>");
      }
      main.push("</div></article>");
    });

    main.push("</div></section>");
  });

  document.getElementById("jump").innerHTML = jump.join("");
  document.getElementById("main").innerHTML = main.join("");

  document.getElementById("stat").textContent =
    (D.blocks || 0) + " 个板块 · 全部内容均来自原文抽取";

  // 折叠交互
  document.getElementById("main").addEventListener("click", function (e) {
    var head = e.target.closest(".c-head");
    if (!head) { return; }
    head.parentElement.classList.toggle("open");
  });

  // 一键全部折叠 / 展开
  document.getElementById("toggleAll").addEventListener("click", function () {
    var cards = document.querySelectorAll("article.card");
    var anyOpen = Array.prototype.some.call(cards, function (c) {
      return c.classList.contains("open");
    });
    Array.prototype.forEach.call(cards, function (c) {
      c.classList.toggle("open", !anyOpen);
    });
    this.textContent = anyOpen ? "全部展开" : "全部折叠";
  });

  // 把带缩进的纯文本转成层级列表，让「分类框架」这类内容能看出结构
  function formatText(text) {
    if (!text) { return ""; }
    var lines = text.split(/\n/);
    var hasList = lines.some(function (l) { return /^\s*(\d+[.)]|[-*•])\s+/.test(l); });
    if (!hasList) {
      return text.split(/\n{2,}/).map(function (p) {
        return "<p>" + esc(p.trim()).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    var html = [];
    var stack = [];   // 每层的缩进宽度
    lines.forEach(function (raw) {
      if (!raw.trim()) { return; }
      var m = raw.match(/^(\s*)(\d+[.)]|[-*•])\s+(.*)$/);
      if (!m) {
        if (html.length && stack.length) {
          html[html.length - 1] = html[html.length - 1].replace(/<\/li>$/, " " + esc(raw.trim()) + "</li>");
        } else {
          html.push("<p>" + esc(raw.trim()) + "</p>");
        }
        return;
      }
      var indent = m[1].replace(/\t/g, "    ").length;
      var body = esc(m[3]);
      if (m[2].match(/^\d/)) { body = "<b>" + body + "</b>"; }

      while (stack.length && indent < stack[stack.length - 1]) {
        html.push("</li></ul>"); stack.pop();
      }
      if (!stack.length || indent > stack[stack.length - 1]) {
        html.push("<ul>"); stack.push(indent);
      } else {
        html.push("</li>");
      }
      html.push("<li>" + body);
    });
    while (stack.length) { html.push("</li></ul>"); stack.pop(); }
    return html.join("");
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
</script>
</body>
