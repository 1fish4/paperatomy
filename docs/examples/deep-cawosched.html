    h.push('<span class="count">' + nodes.length + ' 个环节 · 可播放</span></div>');
    h.push('<article class="chain-card">');

    if (CHAIN.thesis) {
      h.push('<p class="chain-thesis"><b>主张</b>' + esc(CHAIN.thesis) + "</p>");
    }

    h.push('<div class="chain-rail" data-rail>' + railHTML(nodes) + "</div>");
    h.push('<div class="chain-detail" data-detail></div>');

    h.push('<div class="chain-bar">');
    h.push('<button class="cb-btn" data-act="play">▶ 播放</button>');
    h.push('<button class="cb-btn ghost" data-act="prev" aria-label="上一步">←</button>');
    h.push('<button class="cb-btn ghost" data-act="next" aria-label="下一步">→</button>');
    h.push('<div class="cb-track" data-track><div class="cb-fill" data-fill></div></div>');
    h.push('<span class="cb-count" data-count></span>');
    h.push("</div>");

    if (CHAIN.warnings && CHAIN.warnings.length) {
      h.push('<div class="chain-warn">');
      CHAIN.warnings.forEach(function (w) {
        h.push("<span>" + esc(w) + "</span>");
      });
      h.push("</div>");
    }

    h.push("</article></section>");
    return h.join("");
  }

  function railHTML(nodes) {
    var h = [];
    nodes.forEach(function (n, i) {
      h.push('<div class="cc" data-i="' + i + '" style="--c:' + typeColor(n.type) + '">');
      h.push('<div class="cc-t"><i></i>' + esc(typeLabel(n.type)) + "</div>");
      h.push('<div class="cc-l">' + esc(n.label) + "</div>");
      h.push("</div>");
      if (i < nodes.length - 1) {
        h.push('<div class="cl" data-link="' + i + '"><i></i></div>');
      }
    });
    return h.join("");
  }

  function typeLabel(t) {
    var meta = (CHAIN.types || {})[t];
    return meta ? meta.label : t;
  }

  function typeColor(t) {
    var meta = (CHAIN.types || {})[t];
    return meta ? meta.color : "#8FD2F0";
  }

  function detailHTML(n) {
    var h = ['<div class="cd-head">'];
    h.push('<span class="cd-badge" style="color:' + typeColor(n.type) + '">' +
           esc(typeLabel(n.type)) + "</span>");
    h.push('<span class="cd-title">' + esc(n.label) + "</span>");
    h.push(askBtn("n:" + n.id, true) + "</div>");

    if (n.detail) { h.push('<p class="cd-text">' + esc(n.detail) + "</p>"); }

    if (n.type === "change" && n.before && n.after) {
      h.push('<div class="delta">');
      h.push('<div class="delta-col before"><div class="delta-tag">改动前</div>' +
             diagramHTML(n.before) + "</div>");
      h.push('<div class="delta-arrow">→</div>');
      h.push('<div class="delta-col after"><div class="delta-tag">改动后</div>' +
             diagramHTML(n.after) + "</div>");
      h.push("</div>");
    } else if (n.type === "taxonomy" && n.root) {
      h.push(taxHTML(n.root));
    } else if (n.metric) {
      h.push(metricHTML(n.metric));
      if (n.before) { h.push(diagramHTML(n.before)); }
    } else if (n.before) {
      h.push(diagramHTML(n.before));
    }

    if (n.forks && n.forks.length) {
      // 分叉：这个节点分出的并行方向——独立贡献各自成卡，不再压成一条线
      h.push('<div class="forks"><div class="forks-cap">并行分支 ×' +
        n.forks.length + "</div>");
      n.forks.forEach(function (f) {
        h.push('<div class="fork-card"><b>' + esc(f.label) + "</b>");
        if (f.detail) { h.push('<span>' + esc(f.detail) + "</span>"); }
        h.push("</div>");
      });
      h.push("</div>");
    }

    if (n.evidence && n.evidence.length) {
      var ev = n.evidence[0];
      h.push('<div class="cd-ev"><b>' + esc(locatorOf(ev)) + "</b>");
      h.push("<span>" + esc(trunc(ev.quote, 170)) + "</span>");
      if (ev.quote_zh && ev.quote_zh !== ev.quote) {
        h.push('<span class="zh">' + esc(trunc(ev.quote_zh, 170)) + "</span>");
      }
      h.push("</div>");
    }
    return h.join("");
  }

  function diagramHTML(spec) {
    if (!spec) { return ""; }
    var cap = spec.label ? '<div class="dg-cap">' + esc(spec.label) + "</div>" : "";

    if (spec.kind === "tokens") {
      var n = Math.max(1, Math.min(12, Number(spec.n) || 4));
      var cadence = Number(spec.cadence);
      if (!isFinite(cadence) || cadence <= 0) { cadence = 1; }
      var h = ['<div class="dg">'];
      for (var i = 0; i < n; i++) {
        // 用间隔象征节奏：cadence 越大，点亮越慢。速度差异因此「看得见」。
        var delay = (i * cadence * 0.13).toFixed(2);
        h.push('<span class="dg-tk" style="--d:' + delay + '"></span>');
      }
      h.push("</div>");
      return cap + h.join("");
    }

    if (spec.kind === "bars") {
      var items = spec.items || [];
      var max = 0;
      items.forEach(function (it) {
        max = Math.max(max, Math.abs(Number(it.value) || 0));
      });
      max = max || 1;
      var hb = ["<div class=\"dg-bars\">"];
      items.forEach(function (it) {
        var v = Number(it.value) || 0;
        var pct = Math.round((Math.abs(v) / max) * 100);
        hb.push('<div class="dg-bar"><span>' + esc(it.label || "") + "</span>");
        hb.push('<span class="dg-track"><span class="dg-fill" style="--w:' +
                pct + '%"></span></span>');
        hb.push('<span class="dg-val">' + esc(String(it.value)) + "</span></div>");
      });
      hb.push("</div>");
      return cap + hb.join("");
    }

    if (spec.kind === "blocks") {
      var list = spec.items || [];
      var hl = typeof spec.highlight === "number" ? spec.highlight : -1;
      var hbl = ['<div class="dg-blocks">'];
      list.forEach(function (it, k) {
        hbl.push('<div class="dg-bl' + (k === hl ? " hl" : "") + '">' +
                 esc(it) + "</div>");
      });
      hbl.push("</div>");
      return cap + hbl.join("");
    }

    return cap + '<p class="dg-text">' + esc(spec.text || "") + "</p>";
  }

  function metricHTML(m) {
    var raw = String(m.value == null ? "" : m.value);
    var num = parseFloat(raw.replace(/[^0-9.\-]/g, ""));
    var h = ['<div class="metric">'];
    h.push('<span class="metric-n" data-to="' + (isFinite(num) ? num : "") +
           '">' + esc(raw) + "</span>");
    if (m.unit) { h.push('<span class="metric-u">' + esc(m.unit) + "</span>"); }
    if (m.label) { h.push('<span class="metric-l">' + esc(m.label) + "</span>"); }
    h.push("</div>");
    return h.join("");
  }

  function taxHTML(root) {
    var h = ['<div class="cd-tax">'];
    (function walk(node, d) {
      if (!node || !node.name) { return; }
      h.push('<div class="ct" data-d="' + d + '"><span class="ct-dot"></span>');
      h.push('<span class="ct-n">' + esc(node.name) + "</span>");
      if (node.what) { h.push('<span class="ct-w">' + esc(node.what) + "</span>"); }
      h.push("</div>");
      var kids = node.children || [];
      if (kids.length) {
        h.push('<div class="ct-kids">');
        kids.forEach(function (c) { walk(c, d + 1); });
        h.push("</div>");
      }
    })(root, 0);
    h.push("</div>");
    return h.join("");
  }

  // 数字滚动：只有能解析成数字的才动，否则原样显示
  function animateNumber(el) {
    var finalText = el.textContent;
    var target = parseFloat(el.getAttribute("data-to"));
    if (!isFinite(target)) { return; }
    // 先落盘正确值：万一 rAF 被节流（后台标签页、无头截图），
    // 界面上也不能留一个错了的数字
    el.textContent = finalText;
    var dot = finalText.indexOf(".");
    var decimals = dot >= 0 ? (finalText.length - dot - 1) : 0;
    var t0 = null;
    function frame(t) {
      if (t0 === null) { t0 = t; }
      var p = Math.min(1, (t - t0) / 700);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = (target * eased).toFixed(decimals);
      if (p < 1) { requestAnimationFrame(frame); }
    }
    requestAnimationFrame(frame);
    // 兜底：动画停摆也必须回到正确值
    setTimeout(function () { el.textContent = finalText; }, 820);
  }

  function initChain() {
    if (!CHAIN || !CHAIN.nodes || !CHAIN.nodes.length) { return; }
    var card = document.querySelector(".chain-card");
    if (!card) { return; }

    var rail = card.querySelector("[data-rail]");
    var detail = card.querySelector("[data-detail]");
    var fill = card.querySelector("[data-fill]");
    var count = card.querySelector("[data-count]");
    var playBtn = card.querySelector('[data-act="play"]');
    var track = card.querySelector("[data-track]");
    var total = CHAIN.nodes.length;
    var st = { i: 0, timer: null, auto: false };

    function dwellFor(node) {
      if (node.type === "change") { return 3200; }
      if (node.type === "effect") { return 2400; }
      if (node.type === "taxonomy") { return 2600; }
      return 1800;
    }

    function paint(run) {
      var idx = st.i;
      Array.prototype.forEach.call(rail.querySelectorAll(".cc"), function (el) {
        var k = Number(el.getAttribute("data-i"));
        el.classList.toggle("is-active", k === idx);
        el.classList.toggle("is-done", k < idx);
      });
      Array.prototype.forEach.call(rail.querySelectorAll(".cl"), function (el) {
        var k = Number(el.getAttribute("data-link"));
        el.classList.toggle("on", k < idx);
        el.classList.toggle("flow", k === idx);
      });

      detail.innerHTML = detailHTML(CHAIN.nodes[idx]);
      if (run) {
        // 重跑 CSS 动画必须先把类摘掉并强制重排，否则浏览器认为没变化
        detail.classList.remove("run");
        void detail.offsetWidth;
        detail.classList.add("run");
      }

      var num = detail.querySelector(".metric-n");
      if (num) { animateNumber(num); }

      fill.style.width = ((idx + 1) / total * 100) + "%";
      count.textContent = (idx + 1) + " / " + total;
      playBtn.textContent = st.timer
        ? "⏸ 暂停"
        : (idx >= total - 1 ? "↻ 重播" : "▶ 播放");
    }

    function stop() {
      if (st.timer) { clearTimeout(st.timer); st.timer = null; }
    }

    function schedule() {
      st.timer = setTimeout(function () {
        if (st.i < total - 1) {
          st.i += 1;
          paint(true);
          schedule();
        } else {
          stop();
          paint(false);
        }
      }, dwellFor(CHAIN.nodes[st.i]));
    }

    function play() {
      if (st.timer) { stop(); paint(false); return; }
      if (st.i >= total - 1) { st.i = 0; }
      paint(true);
      schedule();
    }

    function go(n) {
      stop();
      st.i = Math.max(0, Math.min(total - 1, n));
      paint(true);
    }

    card.addEventListener("click", function (e) {
      var btn = e.target.closest("[data-act]");
      if (btn) {
        var act = btn.getAttribute("data-act");
        if (act === "play") { play(); }
        else if (act === "next") { go(st.i + 1); }
        else if (act === "prev") { go(st.i - 1); }
        return;
      }
      if (track && track.contains(e.target)) {
        var rect = track.getBoundingClientRect();
        var ratio = (e.clientX - rect.left) / Math.max(rect.width, 1);
        go(Math.round(ratio * (total - 1)));
        return;
      }
      var cc = e.target.closest(".cc");
      if (cc) { go(Number(cc.getAttribute("data-i"))); }
    });

    paint(false);

    // 第一次滚到这里时自动播一遍：动起来比一个静止的流程图有说服力得多。
    // 只自动播一次，之后完全交给用户。
    if (typeof IntersectionObserver === "function") {
      var io = new IntersectionObserver(function (entries) {
        entries.forEach(function (en) {
          if (en.isIntersecting && !st.auto) {
            st.auto = true;
            io.disconnect();
            // 留一点时间让人先读到「主张」，再开始动
            setTimeout(play, 900);
          }
        });
      }, { threshold: 0.55 });
      io.observe(card);
    }
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  // 证据摘录在卡片里放不下全句，截断但要留出省略号，别让人以为是原文结尾
  function trunc(s, n) {
    s = String(s || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }



  // ======================= 文献网络 =======================
  // 径向双叶图：中心=本文；左叶=它引用的（过去），右叶=引用它的（未来）。
  // 不变式在数据层已守住：节点全部来自 PDF 参考文献与 OpenAlex，
  // 相关度是计算值并带依据。这里只做呈现，不做任何"判断"。

  function initNetwork() {
    var N = D.network;
    var box = document.getElementById("netViz");
    if (!box || !N || !N.nodes || !N.nodes.length) { return; }

    var W = 940, H = 560, cx = W / 2, cy = H / 2;
    var cited = N.nodes.filter(function (n) { return n.kind === "cited"; });
    var citing = N.nodes.filter(function (n) { return n.kind === "citing"; });
    // 右叶是时间线：早的靠近底部（过去侧），新的越靠上
    citing.sort(function (x, y) { return (x.year || 0) - (y.year || 0); });
    var maxC = 1;
    N.nodes.forEach(function (n) { if (n.cited_by > maxC) { maxC = n.cited_by; } });

    // 半径：相关度越高越靠近中心（92–240）
    function ringR(n) { return 92 + 148 * (1 - Math.min(n.relevance, 1)); }
    // 节点大小：被引数的对数缩放（4.5–15）
    function dotR(n) {
      return 4.5 + 10.5 * Math.log10(n.cited_by + 1) / Math.log10(maxC + 1);
    }
    // 颜色：相关度 0 → 浅灰蓝，1 → 深青
    function color(rel) {
      rel = Math.max(0, Math.min(rel, 1));
      return "hsl(203," + Math.round(22 + 40 * rel) + "%," +
             Math.round(78 - 40 * rel) + "%)";
    }

    function place(nodes, start, end) {
      var n = nodes.length;
      nodes.forEach(function (n2, i) {
        var a = (n === 1) ? (start + end) / 2 : start + (end - start) * i / (n - 1);
        var rad = a * Math.PI / 180;
        n2._x = cx + ringR(n2) * Math.cos(rad);
        n2._y = cy - ringR(n2) * Math.sin(rad);
      });
    }
    place(cited, 105, 255);     // 左半圆（过去）；两端各留 10° 缝隙，
    place(citing, -75, 75);     // 右半圆（未来）——否则高相关节点挤在中心正上/下

    var s = ['<svg class="net-svg" viewBox="0 0 ' + W + " " + H + '">'];

    s.push('<text class="net-leaf" x="' + (cx - 265) + '" y="' + (cy - 218) + '">\u2190 \u5b83\u5f15\u7528\u7684 \u00b7 \u8fc7\u53bb</text>');
    s.push('<text class="net-leaf" x="' + (cx + 265) + '" y="' + (cy - 218) + '">\u5f15\u7528\u5b83\u7684 \u00b7 \u672a\u6765 \u2192</text>');

    s.push('<g class="net-center">');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="34" fill="#2E6F8E" opacity=".12"/>');
    s.push('<circle cx="' + cx + '" cy="' + cy + '" r="5" fill="#2E6F8E"/>');
    var ct = esc(trunc((N.center && N.center.title) || "本文", 26));
    s.push('<text x="' + cx + '" y="' + (cy + 52) + '">' + ct + "</text>");
    s.push("</g>");

    N.nodes.forEach(function (n, i) {
      var mx = (cx + n._x) / 2, my = (cy + n._y) / 2;
      var dx = n._x - cx, dy = n._y - cy, len = Math.sqrt(dx * dx + dy * dy) || 1;
      var bow = 26;
      var qx = mx - dy / len * bow, qy = my + dx / len * bow;
      s.push('<path id="ne' + i + '" class="net-edge" d="M' + cx + " " + cy +
             " Q" + qx + " " + qy + " " + n._x + " " + n._y + '"/>');
    });

    N.nodes.forEach(function (n, i) {
      var r = dotR(n);
      s.push('<g class="net-node" data-ni="' + i + '">');
      s.push('<circle cx="' + n._x.toFixed(1) + '" cy="' + n._y.toFixed(1) +
             '" r="' + r.toFixed(1) + '" fill="' + color(n.relevance) + '"/>');
      var label = String(n.year || "");
      if (label) {
        // 年份放在节点**外侧**（沿半径外推），不压在圆上、不与邻点重叠
        var wdx = n._x - cx, wdy = n._y - cy;
        var wlen = Math.sqrt(wdx * wdx + wdy * wdy) || 1;
        var tx = n._x + wdx / wlen * (r + 12);
        var ty = n._y + wdy / wlen * (r + 12) + 3;
        s.push("<text x=\"" + tx.toFixed(1) + "\" y=\"" + ty.toFixed(1) +
               '" text-anchor="middle">' + esc(label) + "</text>");
      }
      s.push("<title>" + esc(trunc(n.title, 90)) + " · 相关度 " +
             Math.round(n.relevance * 100) + "% · 被引 " + n.cited_by + "</title>");
      s.push("</g>");
    });

    s.push("</svg>");
    box.innerHTML = s.join("");

    function show(n) {
      var d = document.getElementById("netDetail");
      var src = n.origin === "openalex" ? "OpenAlex" : "本文参考文献列表（PDF）";
      var doi = n.doi
        ? ' · <a href="https://doi.org/' + esc(n.doi) + '" target="_blank" rel="noopener">DOI: ' +
          esc(n.doi) + "</a>"
        : "";
      var pct = Math.round(n.relevance * 100);
      var h = ['<div class="net-d-top">'];
      if (n.title_zh) {
        // 中文是机翻（呈现层），节点身份与元数据仍全部来自数据库
        h.push('<span class="net-d-title">' + esc(n.title_zh) + "</span>");
        h.push('<span class="net-d-title-zh">' + esc(n.title) + "</span>");
      } else {
        h.push('<span class="net-d-title">' + esc(n.title) + "</span>");
      }
      h.push('<span class="net-badge ' + n.kind + '">' +
             (n.kind === "cited" ? "本文引用" : "引用本文") + "</span>");
      h.push("</div>");
      h.push('<div class="net-d-meta">' +
        [n.year || null, esc(n.venue || ""), "被引 " + n.cited_by + " 次", doi]
          .filter(Boolean).join(" · ") + "</div>");

      if (n.topics && n.topics.length) {
        h.push('<div class="net-d-topics">');
        n.topics.forEach(function (tp) {
          var parts = [tp.field_zh || tp.field,
                       tp.subfield_zh || tp.subfield, tp.name];
          var label = parts.filter(Boolean).join(" · ");
          h.push('<span class="topic-tag">' + esc(label) + "</span>");
        });
        h.push("</div>");
      }

      h.push('<div class="net-d-score"><span class="net-d-label">与本文相关度</span>' +
        '<span class="net-d-bar"><i style="width:' + pct + '%"></i></span>' +
        '<span class="net-d-pct">' + pct + "%</span></div>");
      h.push('<div class="net-d-reasons">' + n.reasons.map(function (r) {
        return "· " + esc(r);
      }).join("<br>") + "</div>");
      h.push('<div class="net-d-note"><b>✓ 数据来源：' + esc(src) +
        '。</b>节点与被引数为数据库实录，非模型生成；' +
        "相关度为基于共引与关键词的计算值，依据如上。</div>");
      d.innerHTML = h.join("");
      d.classList.add("show");
    }

    var svg = box.querySelector("svg");
    svg.addEventListener("click", function (e) {
      var g = e.target.closest(".net-node");
      if (!g) { return; }
      var i = Number(g.getAttribute("data-ni"));
      show(N.nodes[i]);
      Array.prototype.forEach.call(svg.querySelectorAll(".net-edge.hot"),
        function (el) { el.classList.remove("hot"); });
      var edge = svg.querySelector("#ne" + i);
      if (edge) { edge.classList.add("hot"); }
    });

    // 检索关键词：点击复制。clipboard API 在 file:// 下可能受限，留 execCommand 兜底。
    var kwBox = document.getElementById("ncKws");
    if (kwBox) {
      function fallbackCopy(txt) {
        var ta = document.createElement("textarea");
        ta.value = txt; document.body.appendChild(ta);
        ta.select();
        try { document.execCommand("copy"); } catch (e2) {}
        document.body.removeChild(ta);
      }
      function copyText(txt, el) {
        var done = function () {
          var old = el.textContent;
          el.textContent = "已复制 ✓";
          setTimeout(function () { el.textContent = old; }, 1400);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done,
            function () { fallbackCopy(txt); done(); });
        } else { fallbackCopy(txt); done(); }
      }
      kwBox.addEventListener("click", function (e) {
        var b = e.target.closest(".kw-chip");
        if (!b) { return; }
        if (b.id === "ncKwAll") {
          var all = Array.prototype.map.call(
            kwBox.querySelectorAll(".kw-chip:not(.all)"),
            function (x) { return x.getAttribute("data-kw"); }
          ).join(", ");
          copyText(all, b);
        } else {
          copyText(b.getAttribute("data-kw") || "", b);
        }
      });
    }
  }

  // ======================= 追问这篇论文 =======================
  // 静态打开时 window.__PA_SERVE__ 是 null，按钮会显示「未连接」并给出命令；
  // 由 paperatomy serve 提供页面时，服务端会把它替换成实际端口。
  var ASK_CFG = window.__PA_SERVE__ || null;
  var ASK = { ctx: [], history: [], busy: false, live: false };

  var askPanel = document.getElementById("askPanel");
  var askLog = document.getElementById("askLog");
  var askText = document.getElementById("askText");
  var askSend = document.getElementById("askSend");
  var askSub = document.getElementById("askSub");
  var askCtx = document.getElementById("askCtx");
  var askFab = document.getElementById("askFab");

  // 出处坐标：和 Markdown、命令行完全一致（这里必须是同一套规则，
  // 否则同一份报告换个地方看就对不上了）
  function locatorOf(e) {
    var parts = [];
    if (e.section_no) { parts.push("§" + e.section_no); }
    if (e.para) { parts.push("第 " + e.para + " 段"); }
    if (e.page) { parts.push("p." + e.page); }
    return parts.join(" · ") || "出处未标注";
  }

  function evHTML(list) {
    var ok = list.filter(function (e) { return e.verified !== false; });
    var bad = list.filter(function (e) { return e.verified === false; });
    var h = ['<div class="ev"><div class="ev-title">原文依据</div>'];
    ok.forEach(function (e) {
      h.push('<div class="ev-item"><div class="ev-loc">');
      h.push('<span class="chip">' + esc(locatorOf(e)) + "</span>");
      if (e.section) {
        // 章节标题去掉编号前缀，否则和左边的 §4 重复
        h.push('<span class="sec">' +
          esc(e.section.replace(/^\s*\d{1,2}(?:\.\d{1,2}){0,2}[\s.]+/, "")) +
          "</span>");
      }
      h.push("</div>");
      h.push('<div class="ev-src">' + esc(e.quote) + "</div>");
      if (e.quote_zh && e.quote_zh !== e.quote) {
        h.push('<div class="ev-zh">' + esc(e.quote_zh) + "</div>");
      }
      h.push("</div>");
    });
    if (bad.length) {
      // 定位失败的条目不是原文——如实降级为「模型转述」，
      // 不再显示 §坐标（那本来就是模型自报、程序无法背书的）
      h.push('<div class="ev-title" style="color:var(--warn)">'
        + '⚠ 以下 ' + bad.length + ' 条未能定位到原文原话——是模型转述，不是原文，不可作为引用</div>');
      bad.forEach(function (e) {
        h.push('<div class="ev-item"><div class="ev-loc">'
          + '<span class="raw">模型转述 · 未经原文核实</span></div>');
        h.push('<div class="ev-src" style="opacity:.75">' + esc(e.quote) + "</div>");
        if (e.quote_zh && e.quote_zh !== e.quote) {
          h.push('<div class="ev-zh" style="opacity:.75">' + esc(e.quote_zh) + "</div>");
        }
        h.push("</div>");
      });
    }
    h.push("</div>");
    return h.join("");
  }

  function askBtn(key, dark) {
    return '<button class="ask-btn' + (dark ? " dark" : "") + '" type="button" data-ask="' +
      esc(key) + '" title="把这块内容加入追问"><svg viewBox="0 0 24 24" fill="none" ' +
      'stroke="currentColor" stroke-width="2.4" stroke-linecap="round">' +
      '<path d="M12 5v14M5 12h14"/></svg>追问</button>';
  }

  // 把一块内容压成纯文本交给模型。带上是哪一段、原文怎么说的，
  // 模型才知道「这个」指什么。
  function askPayload(key) {
    if (key.indexOf("b:") === 0) {
      var bid = key.slice(2);
      var found = null;
      D.groups.forEach(function (g) {
        g.blocks.forEach(function (b) { if (b.id === bid) { found = b; } });
      });
      if (!found && hero && hero.id === bid) { found = hero; }
      if (!found) { return null; }
      var text = found.content || "";
      (found.evidence || []).forEach(function (e) {
        text += "\n依据［" + locatorOf(e) + "］" + e.quote +
                (e.quote_zh && e.quote_zh !== e.quote ? "\n译文：" + e.quote_zh : "");
      });
      return { key: key, title: found.title, text: text };
    }
    if (key.indexOf("n:") === 0 && CHAIN) {
      var nid = key.slice(2);
      var node = null;
      (CHAIN.nodes || []).forEach(function (n) { if (n.id === nid) { node = n; } });
      if (!node) { return null; }
      var t = "［" + typeLabel(node.type) + "］" + node.label;
      if (node.detail) { t += "\n" + node.detail; }
      if (node.metric) {
        t += "\n指标：" + node.metric.value + (node.metric.unit || "") +
             "（" + (node.metric.label || "") + "）";
      }
      (node.evidence || []).forEach(function (e) {
        t += "\n依据［" + locatorOf(e) + "］" + e.quote +
             (e.quote_zh && e.quote_zh !== e.quote ? "\n译文：" + e.quote_zh : "");
      });
      return { key: key, title: node.label, text: t };
    }
    return null;
  }

  function renderChips() {
    askCtx.innerHTML = ASK.ctx.map(function (c, i) {
      return '<span class="ctx-chip"><span>' + esc(c.title) + "</span>" +
        '<button type="button" data-drop="' + i + '" aria-label="移除">×</button></span>';
    }).join("");
    askFab.classList.toggle("has-ctx", ASK.ctx.length > 0);
  }

  function openAsk() {
    askPanel.classList.add("open");
    askPanel.setAttribute("aria-hidden", "false");
    if (ASK.live) { setTimeout(function () { askText.focus(); }, 120); }
  }
  function closeAsk() {
    askPanel.classList.remove("open");
    askPanel.setAttribute("aria-hidden", "true");
  }

  function addContext(key) {
    var item = askPayload(key);
    if (!item) { openAsk(); return; }
    var dup = false;
    ASK.ctx.forEach(function (c) { if (c.key === key) { dup = true; } });
    if (!dup) { ASK.ctx.push(item); }
    renderChips();
    openAsk();
  }

  function hideHint() {
    var h = askLog.querySelector(".ask-hint");
    if (h) { h.remove(); }
  }

  function pushMsg(role, text) {
    var node = document.createElement("div");
    node.className = "msg " + (role === "user" ? "user" : "bot");
    if (role === "user") {
      node.textContent = text;
    } else {
      node.innerHTML = '<div class="who">paperatomy</div><div class="body"></div>';
      node.querySelector(".body").innerHTML = formatText(text);
    }
    askLog.appendChild(node);
    askLog.scrollTop = askLog.scrollHeight;
    return node;
  }

  function showError(msg) {
    var node = document.createElement("div");
    node.className = "msg err";
    node.textContent = msg;
    askLog.appendChild(node);
    askLog.scrollTop = askLog.scrollHeight;
  }

  function send(question) {
    if (ASK.busy || !ASK.live) { return; }
    var q = (question || askText.value || "").trim();
    if (!q) { return; }

    askText.value = "";
    askText.style.height = "auto";
    hideHint();

    pushMsg("user", q);
    ASK.history.push({ role: "user", content: q });

    var ctx = ASK.ctx.map(function (c) { return { title: c.title, text: c.text }; });
    ASK.ctx = [];
    renderChips();

    var bubble = pushMsg("bot", "").querySelector(".body");
    var caret = document.createElement("span");
    caret.className = "caret";
    bubble.appendChild(caret);

    ASK.busy = true;
    askSend.disabled = true;

    var answer = "";
    var painted = Date.now();

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        question: q,
        context: ctx,
        history: ASK.history.slice(-8, -1)
      })
    }).then(function (res) {
      if (!res.ok || !res.body) { throw new Error("HTTP " + res.status); }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";

      // 增量是逐 token 来的，每来一个就重排会卡。
      // 攒到 70ms 才画一次，结束时无论如何再画一遍——
      // 「最终值必须由确定的一步给出」，这条上一版在数字滚动上踩过。
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) { return; }
          buffer += decoder.decode(chunk.value, { stream: true });
          var blocks = buffer.split("\n\n");
          buffer = blocks.pop();
          blocks.forEach(function (raw) {
            raw.split("\n").forEach(function (line) {
              if (line.indexOf("data:") !== 0) { return; }
              var obj;
              try { obj = JSON.parse(line.slice(5).trim()); } catch (err) { return; }
              if (obj.delta) {
                answer += obj.delta;
                if (Date.now() - painted > 70) {
                  painted = Date.now();
                  bubble.innerHTML = formatText(answer);
                }
              }
              if (obj.error) { showError(obj.error); }
            });
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (err) {
      showError("连不上本地服务：" + (err && err.message ? err.message : err));
    }).then(function () {
      if (caret.parentNode) { caret.remove(); }
      if (answer) {
        bubble.innerHTML = formatText(answer);
        ASK.history.push({ role: "assistant", content: answer });
      }
      ASK.busy = false;
      askSend.disabled = false;
      askLog.scrollTop = askLog.scrollHeight;
    });
  }

  function initAsk() {
    if (!ASK_CFG) {
      askFab.classList.add("offline");
      askSub.textContent = "未连接本地服务";
      askText.disabled = true;
      askSend.disabled = true;
      askText.placeholder = "需要在本地运行 paperatomy serve";
      // offline 先渲染历史（若有），再补「怎么连服务」的提示——
      // 历史是报告里的数据，静态打开也该能看到
      if (renderQaHistory()) {
        var off = document.createElement("div");
        off.className = "ask-hint";
        off.innerHTML = "<br><b>继续追问需要本地服务。</b><br>" +
          "在终端里跑 paperatomy serve out/报告.json 后刷新本页。";
        askLog.appendChild(off);
        return;
      }
      askLog.innerHTML =
        '<div class="ask-hint"><b>提问需要本地服务。</b><br>' +
        "这份报告是静态文件：它没有模型凭据，也不会替你花钱。在终端里跑——" +
        '<div style="font-family:var(--mono);font-size:12px;background:#fff;' +
        'border:1px solid var(--line);border-radius:6px;padding:7px 10px;margin-top:9px">' +
        "paperatomy serve out/报告.json" + "</div>" +
        "然后打开它给出的地址，这个按钮就能用了。报告里的证据定位、中英对照不用服务也能看。</div>";
      return;
    }
    ASK.live = true;
    askSub.innerHTML = "<b>●</b> 已连接 · 只依据这篇论文";
    askText.disabled = false;
    askSend.disabled = false;
    askLog.scrollTop = askLog.scrollHeight;
  }

  // 历史问答回放：数据在报告 JSON 里，serve 保存，重开不丢。
  // 只读展示，不依赖服务——静态打开也能看。
  function renderQaHistory() {
    if (!D.qa || !D.qa.length) { return false; }
    askLog.innerHTML =
      '<div class="ask-hint">以下是之前的 ' + D.qa.length +
      " 条问答（存在报告里，换次打开还在）：</div>";
    D.qa.forEach(function (m) {
      pushMsg("user", m.question);
      var b = pushMsg("bot", "");
      b.querySelector(".body").innerHTML = formatText(m.answer || "");
    });
    var tip = document.createElement("div");
    tip.className = "ask-hint";
    tip.innerHTML = "<br><b>报告先回答了「一般读者会问什么」。</b><br>" +
      "剩下的疑问在这里问。答案只从这篇论文的材料里来，找不到它会说找不到。" +
      '<a class="ask-eg" data-q="这篇论文最核心的贡献是什么？用三句话说清。">' +
      "试试：核心贡献是什么</a>";
    askLog.appendChild(tip);
    return true;
  }
  renderQaHistory();

  askFab.addEventListener("click", function () {
    if (askPanel.classList.contains("open")) { closeAsk(); } else { openAsk(); }
  });
  askClose.addEventListener("click", closeAsk);
  askSend.addEventListener("click", function () { send(); });

  askText.addEventListener("keydown", function (e) {
    // Enter 发送、Shift+Enter 换行——聊天框的通用约定
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  askText.addEventListener("input", function () {
    askText.style.height = "auto";
    askText.style.height = Math.min(askText.scrollHeight, 132) + "px";
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && askPanel.classList.contains("open")) { closeAsk(); }
  });

  // 全部走委托：卡片是 innerHTML 生成的，逐个绑定会漏
  document.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-ask]");
    if (btn) {
      e.preventDefault();
      e.stopPropagation();   // 否则会触发卡片折叠
      addContext(btn.getAttribute("data-ask"));
      return;
    }
    var drop = e.target.closest("[data-drop]");
    if (drop) {
      e.stopPropagation();
      ASK.ctx.splice(Number(drop.getAttribute("data-drop")), 1);
      renderChips();
      return;
    }
    var eg = e.target.closest("[data-q]");
    if (eg) {
      e.preventDefault();
      send(eg.getAttribute("data-q"));
    }
  });

  initAsk();

  // 工作台打开的报告：顶部显眼返回 + 左下角备用入口
  if (window.__PA_SERVE__ && window.__PA_SERVE__.mode === "workbench") {
    var backFab = document.getElementById("backFab");
    backFab.classList.add("show");
    backFab.addEventListener("click", function () {
      location.href = "/";
    });
    var backTop = document.createElement("a");
    backTop.className = "back-top";
    backTop.href = "/";
    backTop.textContent = "← 返回工作台";
    backTop.classList.add("show");
    document.body.appendChild(backTop);

    // 对照原文 / 图表速览：报告对应 PDF 存在时才提供
    var PDF = window.__PA_SERVE__ ? window.__PA_SERVE__.pdf : null;
    if (PDF) {
      var btns = document.createElement("div");
      btns.className = "side-btns";
      btns.innerHTML = '<button id="btnOrig">对照原文</button>' +
        '<button id="btnDemo">动态讲解</button>';
      document.body.appendChild(btns);
      btns.classList.add("show");

      var panel = document.createElement("div");
      panel.className = "side-panel";
      panel.innerHTML = '<div class="sp-head"><span id="spCap"></span>' +
        '<button id="spClose" style="border:none;background:none;cursor:pointer;' +
        'font-size:16px;color:inherit">×</button></div>' +
        '<div class="sp-body" id="spBody"></div>';
      document.body.appendChild(panel);
      // 按钮绑定（v0.9.6 图表 v3 拼接时被误删，导致面板点不开——回归测试已锁）
      document.getElementById("btnOrig").addEventListener("click",
        function () { toggle("orig"); });
      document.getElementById("btnDemo").addEventListener("click",
        function () { toggle("demo"); });
      document.getElementById("spClose").addEventListener("click",
        function () { closePanel(); });
      panel.dataset.bound = "3";   // 诊断用：3 个按钮绑定完成

      var cur = "";
      // 深链：#orig 直达对照原文；#td/#figs 落到附图区（v0.11.0）
      if (location.hash === "#td" || location.hash === "#figs") {
        // v0.11.0 图已进模块，老深链落到文末附图区
        setTimeout(function () {
          var a = document.getElementById("figAnnex");
          if (a) { a.open = true; a.scrollIntoView({behavior: "smooth"}); }
        }, 1500);
      }
      if (location.hash === "#demo") {
        setTimeout(function () {
          var b = document.getElementById("btnDemo");
          if (b) { b.click(); }
        }, 300);
      }
      if (location.hash === "#orig") {
        setTimeout(function () {
          var b = document.getElementById("btnOrig");
          if (b) { b.click(); }
        }, 300);
      }
      function closePanel() {
        panel.classList.remove("open");
        panel.classList.remove("wide");
        panel.classList.remove("wide");
        document.body.classList.remove("with-side");
        document.getElementById("btnOrig").classList.remove("on");
        document.getElementById("btnDemo").classList.remove("on");
        DEMO.playing = false;
        if (DEMO.timer) { clearInterval(DEMO.timer); DEMO.timer = null; }
        cur = "";
      }
      function toggle(which) {  // orig | demo
        if (which !== "orig" && which !== "demo") { return; }
        panel.classList.toggle("wide", which === "demo");
        panel.classList.toggle("wide", which === "demo");
        if (cur === which) { closePanel(); return; }
        cur = which;
        panel.classList.add("open");
        document.body.classList.add("with-side");
        document.getElementById("btnOrig").classList.toggle("on",
          which === "orig");
        document.getElementById("btnDemo").classList.toggle("on",
          which === "demo");
        var body = document.getElementById("spBody");
        var cap = document.getElementById("spCap");
        if (which === "orig") {
          cap.textContent = "论文原文（渲染自 PDF）";
          fetch("/api/pdfinfo?file=" + encodeURIComponent(__PA_SERVE__.report))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d.available) { body.textContent = "找不到对应 PDF。"; return; }
              var h = [];
              for (var i = 1; i <= d.pages; i++) {
                h.push('<img loading="lazy" src="/pageimg/' +
                  encodeURIComponent(PDF.replace(/\.pdf$/, "")) + "/" + i +
                  '.png" alt="第 ' + i + ' 页">');
                h.push('<div class="pno">第 ' + i + " 页 / 共 " + d.pages + " 页</div>");
              }
              body.innerHTML = h.join("");
            })
            .catch(function (e) { body.textContent = "加载失败：" + e; });
        } else {
          cap.textContent = "动态讲解（模型生成分镜）";
          initDemo(body);
        }
      }
    }
  }

  // 打开 http://127.0.0.1:8770/#ask 直接展开面板，省一次点击
  if (location.hash === "#ask" && ASK.live) { openAsk(); }

})();
</script>
