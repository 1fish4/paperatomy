<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>paperatomy · 论文解剖</title>
<style>
  :root {
    --bg:       #FAF8F4;
    --card:     #FFFFFF;
    --ink:      #1B2430;
    --ink2:     #56616F;
    --ink3:     #8A94A2;
    --line:     #E7E2D8;
    --line2:    #F1EDE5;
    --accent:   #2E6F8E;
    --accent2:  #4A9BBF;
    --soft:     #E7F1F6;
    --warn:     #B8703F;
    --warnSoft: #FBF1E6;
    --ok:       #4E9A72;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
            "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC", sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas,
            "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--sans); font-size: 15px; line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 32px 96px; }

  header.top { padding: 56px 0 28px; border-bottom: 1px solid var(--line); }
  .kicker {
    font-family: var(--mono); font-size: 12px; letter-spacing: .12em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 14px;
  }
  h1 {
    margin: 0 0 14px; font-size: 30px; line-height: 1.3;
    letter-spacing: -.015em; font-weight: 600; max-width: 40ch;
  }
  .meta { font-size: 13px; color: var(--ink3); display: flex; flex-wrap: wrap; gap: 6px 14px; }
  .meta span { display: inline-flex; align-items: center; gap: 5px; }
  .meta b { font-weight: 600; color: var(--ink2); }

  nav.jump {
    position: sticky; top: 0; z-index: 20;
    background: rgba(250,248,244,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0; margin-bottom: 34px;
  }
  .jump-links { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; }
  nav.jump a {
    font-size: 13px; color: var(--ink2); text-decoration: none;
    padding: 5px 12px; border-radius: 7px; white-space: nowrap;
    transition: background .15s, color .15s;
  }
  nav.jump a:hover { background: var(--line2); color: var(--ink); }
  .jump-toggle {
    flex: none; font-size: 12px; font-family: inherit;
    color: var(--ink2); background: var(--card);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 12px; cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .jump-toggle:hover { border-color: var(--accent2); color: var(--accent); }

  .hero {
    background: var(--card); border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 14px; padding: 30px 34px; margin-bottom: 42px;
    box-shadow: 0 1px 2px rgba(27,36,48,.03), 0 8px 28px rgba(27,36,48,.045);
  }
  .hero .label {
    font-size: 11.5px; font-weight: 700; letter-spacing: .1em;
    color: var(--accent); text-transform: uppercase; margin-bottom: 12px;
  }
  .hero p { margin: 0; font-size: 20px; line-height: 1.72; letter-spacing: -.01em; }

  section.group { margin-bottom: 52px; scroll-margin-top: 68px; }
  .g-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid var(--line);
  }
  .g-head h2 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .g-head .count { font-size: 12px; color: var(--ink3); font-family: var(--mono); }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 16px; align-items: start;
  }

  article.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gc, var(--line));
    border-radius: 12px; padding: 0; overflow: hidden;
    transition: border-color .18s, box-shadow .18s;
  }
  article.card:hover { border-color: #D8D1C3; box-shadow: 0 4px 18px rgba(27,36,48,.05); }
  .c-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 20px; cursor: pointer; user-select: none;
  }
  .c-head h3 { margin: 0; font-size: 14.5px; font-weight: 600; flex: 1; }
  .badge {
    font-size: 11px; padding: 1px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--ink3); white-space: nowrap;
  }
  .badge.low { color: var(--warn); border-color: var(--warn); background: var(--warnSoft); }
  .chev {
    width: 16px; height: 16px; flex: none; color: var(--ink3);
    transition: transform .2s;
  }
  article.open .chev { transform: rotate(90deg); }

  .c-body { display: none; padding: 0 20px 18px; }
  article.open .c-body { display: block; }
  .c-body .txt { font-size: 14.5px; line-height: 1.8; color: var(--ink2); }
  .c-body .txt p { margin: 0 0 12px; }
  .c-body .txt p:last-child { margin-bottom: 0; }

  .txt ul { margin: 0 0 12px; padding-left: 20px; }
  .txt li { margin-bottom: 5px; }
  .txt ul ul { margin-top: 5px; margin-bottom: 0; }
  .txt li::marker { color: var(--accent2); }

  .ev { margin-top: 16px; border-top: 1px dashed var(--line); padding-top: 14px; }
  .ev-title {
    font-size: 11.5px; font-weight: 700; letter-spacing: .08em;
    color: var(--ink3); text-transform: uppercase; margin-bottom: 9px;
  }
  .ev-item { display: flex; gap: 10px; margin-bottom: 9px; font-size: 13px; line-height: 1.65; }
  .ev-item:last-child { margin-bottom: 0; }
  .ev-page {
    flex: none; font-family: var(--mono); font-size: 11px;
    color: var(--accent); background: var(--soft);
    border-radius: 5px; padding: 1px 7px; height: fit-content;
    min-width: 40px; text-align: center;
  }
  .ev-quote { color: var(--ink3); font-style: italic; }

  .empty { color: var(--ink3); font-style: italic; }

  /* ---------- 动态演示 ---------- */
  .viz-list { display: flex; flex-direction: column; gap: 18px; }

  article.viz {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(27,36,48,.03), 0 10px 30px rgba(27,36,48,.04);
  }
  .viz-head {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 22px; border-bottom: 1px solid var(--line2);
    background: linear-gradient(180deg, #FDFCFA, #FFFFFF);
  }
  .viz-kind {
    flex: none; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    color: var(--accent); background: var(--soft);
    border-radius: 6px; padding: 3px 9px;
  }
  .viz-head h3 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; letter-spacing: -.01em; }
  .viz-ctl { display: flex; align-items: center; gap: 6px; flex: none; }
  .viz-btn {
    font-family: inherit; font-size: 12.5px; color: var(--ink2);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 11px; cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
  }
  .viz-btn:hover { border-color: var(--accent2); color: var(--accent); }
  .viz-btn.primary {
    background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; padding: 5px 15px;
  }
  .viz-btn.primary:hover { background: #27607C; border-color: #27607C; color: #fff; }
  .viz-btn:disabled { opacity: .4; cursor: default; }

  .viz-stage { padding: 30px 24px 24px; background: #FFFDFA; overflow-x: auto; }

  /* --- pipeline：横向流程 --- */
  .pipe-row { display: flex; align-items: stretch; min-width: min-content; padding: 6px 2px; }
  .pipe-node {
    flex: 1 1 0; min-width: 96px; max-width: 168px;
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 14px 10px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--card);
    text-align: center; transition: all .4s cubic-bezier(.4,0,.2,1);
    opacity: .82; transform: translateY(2px);
  }
  .pipe-node .pn-idx {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10.5px;
    background: var(--line2); color: var(--ink3);
    transition: all .4s ease;
  }
  .pipe-node .pn-name { font-size: 13px; line-height: 1.45; color: var(--ink2); }
  .pipe-node.is-done {
    opacity: 1; transform: none;
    border-color: #CBDCD6; background: #F7FBF9;
  }
  .pipe-node.is-done .pn-idx { background: #7A9E7E; color: #fff; }
  .pipe-node.is-done .pn-name { color: var(--ink2); }
  .pipe-node.is-active {
    opacity: 1; transform: translateY(-3px) scale(1.03);
    border-color: var(--accent); background: var(--card);
    box-shadow: 0 6px 22px rgba(46,111,142,.18);
  }
  .pipe-node.is-active .pn-idx { background: var(--accent); color: #fff; }
  .pipe-node.is-active .pn-name { color: var(--ink); font-weight: 600; }

  .pipe-link { flex: 0 0 34px; position: relative; align-self: center; height: 2px; }
  .pipe-link::before {
    content: ""; position: absolute; inset: 0;
    background: #D9D2C4; transition: background .4s;
  }
  .pipe-link::after {
    content: ""; position: absolute; right: -1px; top: -4px;
    border: 5px solid transparent; border-left-color: #D9D2C4;
    transition: border-left-color .4s;
  }
  .pipe-link.on::before { background: #9FC6B4; }
  .pipe-link.on::after { border-left-color: #9FC6B4; }
  .pipe-link.flow .pulse {
    position: absolute; top: -2px; left: 0; width: 6px; height: 6px;
    border-radius: 50%; background: var(--accent);
    animation: travel 1.5s linear infinite;
  }
  @keyframes travel {
    0%   { left: 0; opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { left: calc(100% - 6px); opacity: 0; }
  }

  /* --- example：纵向走查 --- */
  .ex-track { display: flex; flex-direction: column; gap: 0; max-width: 760px; margin: 0 auto; }
  .ex-scenario {
    font-size: 13px; color: var(--ink2); background: var(--line2);
    border-radius: 9px; padding: 10px 14px; margin-bottom: 18px;
    border-left: 3px solid var(--ink3);
  }
  .ex-scenario b { color: var(--ink); font-weight: 600; }
  .ex-step {
    display: flex; gap: 14px; padding: 12px 14px; border-radius: 10px;
    transition: all .4s ease; opacity: .68;
  }
  .ex-step.is-active { opacity: 1; background: var(--soft); }
  .ex-step.is-done { opacity: 1; }
  .ex-rail { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .ex-dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 11px;
    background: var(--line2); color: var(--ink3); border: 1px solid var(--line);
    transition: all .35s ease;
  }
  .ex-step.is-done .ex-dot { background: #7A9E7E; color: #fff; border-color: #7A9E7E; }
  .ex-step.is-active .ex-dot { background: var(--accent); color: #fff; border-color: var(--accent); }
  .ex-step.is-issue.is-active .ex-dot { background: var(--warn); border-color: var(--warn); }
  .ex-line { flex: 1; width: 1px; background: var(--line); min-height: 12px; }
  .ex-step:last-child .ex-line { display: none; }
  .ex-body { flex: 1; min-width: 0; padding-top: 2px; }
  .ex-state { font-size: 14.5px; color: var(--ink); line-height: 1.65; }
  .ex-issue {
    margin-top: 7px; font-size: 13px; color: var(--warn);
    background: var(--warnSoft); border-radius: 7px; padding: 6px 11px;
    display: inline-block;
  }
  .ex-issue b { font-weight: 700; letter-spacing: .04em; }

  /* --- taxonomy：逐层展开 --- */
  .tax-tree { max-width: 780px; margin: 0 auto; font-size: 14px; }
  .tax-node {
    position: relative; padding: 7px 0 7px 0;
    transition: opacity .5s ease, transform .5s ease;
  }
  .tax-node[data-hidden="1"] { opacity: .12; transform: translateY(-2px); }
  .tax-line { display: flex; align-items: baseline; gap: 9px; }
  .tax-bullet {
    flex: none; width: 7px; height: 7px; border-radius: 2px;
    background: var(--accent2); margin-top: 8px;
  }
  .tax-node[data-depth="0"] .tax-bullet { background: var(--accent); width: 9px; height: 9px; }
  .tax-node[data-depth="2"] .tax-bullet { background: var(--line); width: 5px; height: 5px; }
  .tax-name { font-weight: 600; color: var(--ink); }
  .tax-node[data-depth="2"] .tax-name { font-weight: 400; color: var(--ink2); font-size: 13.5px; }
  .tax-what { color: var(--ink3); font-size: 13px; }
  .tax-children {
    margin-left: 12px; padding-left: 16px;
    border-left: 1px solid var(--line);
  }

  /* --- 详情面板 --- */
  .viz-detail {
    margin: 0 24px; padding: 16px 20px;
    background: var(--soft); border-radius: 11px;
    min-height: 92px;
  }
  .vd-top {
    display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px;
  }
  .vd-num { font-family: var(--mono); font-size: 11.5px; color: var(--accent); flex: none; }
  .vd-name { font-size: 15px; font-weight: 600; color: var(--ink); }
  .vd-what { margin: 0; font-size: 14px; color: var(--ink2); line-height: 1.7; }
  .vd-why {
    margin: 9px 0 0; font-size: 13px; color: var(--ink2);
    padding-top: 9px; border-top: 1px dashed rgba(46,111,142,.25);
  }
  .vd-why b { color: var(--accent); font-weight: 600; margin-right: 6px; }
  .vd-why.missing { color: var(--warn); }
  .vd-why.missing b { color: var(--warn); }
  .vd-issue {
    margin: 8px 0 0; font-size: 13.5px; color: var(--warn);
  }
  .vd-issue b { font-weight: 700; }

  .viz-foot {
    padding: 14px 24px 20px; font-size: 12.5px; color: var(--ink3);
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  }
  .viz-foot .ev-inline { display: flex; gap: 8px; align-items: baseline; }
  .viz-warn {
    font-size: 12px; color: var(--warn); background: var(--warnSoft);
    border-radius: 6px; padding: 2px 9px;
  }

  footer {
    margin-top: 64px; padding-top: 22px; border-top: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink3);
    display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  footer a { color: var(--accent); text-decoration: none; }

  @media print {
    nav.jump, .chev { display: none; }
    article.card { break-inside: avoid; border-color: #ccc; }
    .c-body { display: block !important; }
  }
</style>
</head>

ent large language models, spanning from compression [318], algorithms [56], system-algorithm [184, 248], and hardware [125]."}]}]},{"name":"方法","blocks":[{"id":"method","title":"方法核心","content":"方法核心：作为综述，本文按基础模型生命周期组织文献。首先概述语言、视觉和多模态FMs及其运行时成本（FLOPs与存储分析）；然后从三个层面归纳资源高效技术：(1) 高效架构，包括稀疏/近似/无注意力机制、动态神经网络（MoE、早退出）、扩散模型优化和ViT专用优化；(2) 高效算法，覆盖预训练（数据质量控制/削减、渐进学习、混合精度）、微调（加性、选择性、重参数化调优）、推理（投机解码、输入过滤与压缩、KV cache、长上下文）和模型压缩（剪枝、知识蒸馏、量化、低秩分解）；(3) 高效系统，包括分布式训练（容错、并行、通信、存储、异构GPU、MoE）、硬件感知优化、云端服务和边缘端服务。最后总结未来方向。","confidence":"high","empty":false,"evidence":[{"page":3,"quote":"Section 2 overviews the classical foundation models and their runtime cost. Section 3 investigates the architectural innovations that revise or replace the existing foundation model architectures. Section 4 and Section 5 examine the algorithm-level and system-level literature towards more resource-efficient foundation models. Section 6 concludes the survey and presents potential future directions."}]}]},{"name":"结果","blocks":[{"id":"result","title":"主要结果","content":"主要结果：本文为综述，未在统一数据集上报告自身实验对比，而是归纳各被引方法的报告数字。例如：Mamba相比传统Transformer实现5×加速并随序列长度线性扩展；RetNet训练时相比标准Transformer节省25-50%内存并加速7×；投机解码在T5X上带来2–3×性能提升，在70B Chinchilla上类似加速；SpecTr实现2.13×墙钟加速并额外1.37×加速；H2O降低延迟最高1.9×、吞吐提升29×；Scissorhands减少KV cache推理内存最高5×；TensorGPT将embedding层压缩最高38.40×；GPTQ将每个权重降至3或4 bit，可在1750亿参数GPT模型上以极小精度损失量化；DPM-Solver仅需10-20步去噪；SnapFusion在移动设备上不到2秒生成512×512图像；ERNIE-ViLG在MS-COCO上零样本FID-30k为6.75。论文未给出跨方法的统一基准对比。","confidence":"medium","empty":false,"evidence":[{"page":6,"quote":"This model achieves a notable 5× speed increase over traditional transformers and exhibits linear scaling with sequence length."},{"page":6,"quote":"During training, RetNet demonstrates a 25-50% memory saving and a 7× acceleration compared to the standard Transformer."},{"page":13,"quote":"Yaniv et al. [141] report a 2–3× improvement in performance using speculative decoding on the T5X model, while a concurrent study [36] demonstrates similar speedups on a 70B Chinchilla model."},{"page":14,"quote":"H2O demonstrates the capability to reduce latency by up to 1.9× and increase throughput by 29×."},{"page":15,"quote":"Scissorhands utilizes an innovative compact KV cache and results in a notable reduction in KV cache inference memory usage, achieving up to a 5× reducation while maintaining model quality."},{"page":18,"quote":"GPTQ reduces the bit-width of each weight to 3 or 4 bits, allowing quantization of GPT models with 175 billion parameters with minimal accuracy loss."}]},{"id":"limits","title":"能不能用","content":"作者自述的局限：论文明确限定了综述范围——(i) 只综述算法与系统创新，排除大量硬件设计工作；(ii) 资源定义主要限于物理资源（计算、内存、存储、带宽等），排除训练数据（标签）和隐私；(iii) 主要综述CSRankings收录的顶级CS会议论文，并手动挑选arXiv上相关且可能高影响力的论文；(iv) 主要综述2020年之后发表的论文。作者未提但存在的适用边界/风险：作为综述，论文未提供统一的实验基准或跨方法公平对比，各方法报告的数字来自不同设置，不能直接横向比较；覆盖范围排除硬件和数据/隐私，因此对端到端部署成本或隐私敏感场景的指导有限；文献筛选偏向顶会和2020年后，可能遗漏其他来源或更早的重要工作。","confidence":"high","empty":false,"evidence":[{"page":2,"quote":"(i) We survey only algorithm and system innovations; we exclude a huge body of work at hardware design; (ii) The definition of resource in this survey is limited to mainly physical ones, including computing, memory, storage, bandwidth, etc; we exclude training data (labels) and privacy that can also be regarded as resources; (iii) We mainly survey papers published on top-tier CS conferences, i.e., those included in CSRankings."},{"page":2,"quote":"(iv) We mainly survey papers published after the year of 2020, since the innovation of AI is going fast with old knowledge and methods being overturned frequently."}]}]}],"visuals":[{"primitive":"taxonomy","title":"资源高效基础模型研究的分类框架：架构、算法、系统三大方向","params":{"root":{"name":"Resource-efficient FMs","children":[{"name":"高效架构","what":"修改或替换现有基础模型架构以降低资源开销","children":[{"name":"Efficient Attention","what":"稀疏注意力、近似注意力、无注意力架构","children":[]},{"name":"Dynamic Neural Network","what":"MoE 与 Early Exiting 等动态计算","children":[]},{"name":"Diffusion 优化","what":"采样加速、latent space 扩散、架构变体","children":[]},{"name":"ViT-specific Optimizations","what":"LeViT、MobileViT、EfficientFormer 等轻量 ViT","children":[]}]},{"name":"高效算法","what":"按 FM 生命周期划分的算法级优化","children":[{"name":"Pre-training","what":"数据质量控制、数据削减、渐进学习、混合精度训练","children":[]},{"name":"Finetuning","what":"additive / selective / re-parameter tuning","children":[]},{"name":"Inference","what":"投机解码、输入过滤压缩、KV cache、长上下文","children":[]},{"name":"Model Compression","what":"剪枝、知识蒸馏、量化、低秩分解","children":[]}]},{"name":"高效系统","what":"训练与服务的系统级优化","children":[{"name":"Distributed Training","what":"容错、并行、通信、存储、异构 GPU、MoE","children":[]},{"name":"Hardware-aware Optimizations","what":"算法-硬件协同设计","children":[]},{"name":"Serving on Cloud","what":"prefill/decoding 调度与内存管理","children":[]},{"name":"Serving on Edge","what":"端云协同、端侧 MoE、内存与 I/O 优化","children":[]}]}]}},"confidence":"high","note":"综述的核心贡献就是这套三层分类框架，原文明确给出架构/算法/系统三大板块及各子类。","evidence":[{"page":3,"quote":"Section 3 investigates the architectural innovations that revise or replace the existing foundation model architectures. Section 4 and Section 5 examine the algorithm-level and system-level literature towards more resource-efficient foundation models."},{"page":9,"quote":"which are categorized based on the lifecycle of FMs: pre-training, fine-tuning, serving algorithms, and model compression."},{"page":20,"quote":"This section investigates the system research to enable resource-efficient large FMs, notable at four aspects: (1) distributed training; (2) hardware-aware optimizations; (3) serving in cloud, and (4) serving in edge."}],"warnings":[]},{"primitive":"pipeline","title":"投机解码的推理流程：小模型起草 + 大模型并行验证","params":{"stages":[{"name":"小模型起草","what":"用成本低的小模型自回归地生成候选 token 序列","why":"用小模型承担大部分生成工作以降低开销"},{"name":"大模型并行验证","what":"用大模型对候选 token 并行做验证","why":"保证输出质量与大模型一致"}]},"confidence":"high","note":"原文对投机解码给出了清晰的两阶段流程描述，适合用 pipeline 演。","evidence":[{"page":13,"quote":"It involves generating sequences autoregressively with a cost-efficient small model, followed by parallel token verification using a larger model."}],"warnings":[]},{"primitive":"example","title":"LoRA 初始化问题：高斯随机初始化导致初始梯度极小、收敛慢","params":{"scenario":"LoRA 用高斯随机值初始化低秩矩阵 A、用零初始化 B，对预训练权重做低秩微调","steps":[{"state":"低秩矩阵 A 初始化为高斯随机值，B 初始化为 0","issue":"初始梯度值非常小，收敛缓慢"},{"state":"PiSSA 针对该初始化问题提出改进","issue":null}]},"confidence":"medium","note":"原文给出了 LoRA 初始化的具体卡点，可用 example 原语演示。","evidence":[{"page":13,"quote":"PiSSA [182] identifies an issue where LoRA initializes low-rank matrices with Gaussian random values and zeros, resulting in very small initial gradient values and slow convergence."}],"warnings":[]}]}</script>
<script>
(function () {
  var D = JSON.parse(document.getElementById("paper-data").textContent);

  // 每个分组一个色调，卡片左侧色条用它，视觉上能一眼分清「概览 / 框架 / 结论 / 判断」
  var GROUP_COLORS = ["#2E6F8E", "#4A9BBF", "#7A9E7E", "#B8703F"];

  document.getElementById("title").textContent = D.paper_title || "（未识别标题）";
  document.title = (D.paper_title || "论文解剖") + " · paperatomy";

  var meta = [];
  if (D.template_name) { meta.push("<span>模板 <b>" + esc(D.template_name) + "</b></span>"); }
  if (D.pages)        { meta.push("<span><b>" + D.pages + "</b> 页</span>"); }
  if (D.blocks)       { meta.push("<span><b>" + D.blocks + "</b> 个板块</span>"); }
  if (D.model)        { meta.push("<span>模型 <b>" + esc(D.model) + "</b></span>"); }
  document.getElementById("meta").innerHTML = meta.join("");

  var jump = [];
  var main = [];
  // 必须先声明：后面的 vizSection() 会用到，var 只有声明提升、赋值不提升
  var VIZ = D.visuals || [];
  var VIZ_LABEL = { pipeline: "方法流程", example: "实例走查", taxonomy: "分类体系" };

  // 「一句话结论」单独抽出来做页首大卡：它是整篇最该被先看到的一句，
  // 混在卡片堆里会被淹掉。
  var hero = null;
  D.groups.forEach(function (g) {
    g.blocks = g.blocks.filter(function (b) {
      if (!hero && b.id === "tl_dr") { hero = b; return false; }
      return true;
    });
  });
  D.groups = D.groups.filter(function (g) { return g.blocks.length; });

  if (hero) {
    var hh = ['<div class="hero"><div class="label">' + esc(hero.title) + "</div>"];
    hh.push("<p>" + esc(hero.content || "论文未提及。") + "</p>");
    if (hero.evidence && hero.evidence.length) {
      hh.push('<div class="ev"><div class="ev-title">原文依据</div>');
      hero.evidence.forEach(function (e) {
        hh.push('<div class="ev-item"><span class="ev-page">' +
                esc(e.page ? "p." + e.page : "页?") + "</span>");
        hh.push('<span class="ev-quote">' + esc(e.quote) + "</span></div>");
      });
      hh.push("</div>");
    }
    hh.push("</div>");
    main.push(hh.join(""));
  }

  // 动态演示放在页首大卡之后：它比正文更值得先看，
  // 但要排在「一句话结论」后面，否则读者没有上下文。
  if (VIZ.length) {
    jump.push('<a href="#viz">动态演示</a>');
    main.push(vizSection());
  }

  D.groups.forEach(function (g, gi) {
    var anchor = "g" + gi;
    jump.push('<a href="#' + anchor + '">' + esc(g.name) + "</a>");

    var gc = GROUP_COLORS[gi % GROUP_COLORS.length];
    main.push('<section class="group" id="' + anchor + '" style="--gc:' + gc + '">');
    main.push('<div class="g-head"><h2>' + esc(g.name) + "</h2>");
    main.push('<span class="count">' + g.blocks.length + " 块</span></div>");

    var single = g.blocks.length === 1;
    main.push('<div class="cards' + (single ? " single" : "") + '">');

    g.blocks.forEach(function (b, bi) {
      // 默认全部展开：这是给人读的报告，不是目录。
      // 折叠是「太长时收起来」的手段，不该是打开时的默认状态。
      var open = " open";
      main.push('<article class="card' + open + '">');
      main.push('<div class="c-head">');
      main.push('<h3>' + esc(b.title) + "</h3>");
      if (b.confidence === "low") {
        main.push('<span class="badge low">低置信</span>');
      }
      main.push('<svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" ' +
                'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
                '<path d="M6 4l4 4-4 4"/></svg>');
      main.push("</div>");

      main.push('<div class="c-body">');
      if (b.empty) {
        main.push('<div class="txt"><p class="empty">论文未提及，或材料不足未抽取到内容。</p></div>');
      } else {
        main.push('<div class="txt">' + formatText(b.content) + "</div>");
      }
      if (b.evidence && b.evidence.length) {
        main.push('<div class="ev"><div class="ev-title">原文依据</div>');
        b.evidence.forEach(function (e) {
          var page = e.page ? "p." + e.page : "页码未标注";
          main.push('<div class="ev-item"><span class="ev-page">' + esc(page) + "</span>");
          main.push('<span class="ev-quote">' + esc(e.quote) + "</span></div>");
        });
        main.push("</div>");
      }
      main.push("</div></article>");
    });

    main.push("</div></section>");
  });

  document.getElementById("jump").innerHTML = jump.join("");
  document.getElementById("main").innerHTML = main.join("");
  initViz();

  document.getElementById("stat").textContent =
    (D.blocks || 0) + " 个板块 · 全部内容均来自原文抽取";

  // 折叠交互
  document.getElementById("main").addEventListener("click", function (e) {
    var head = e.target.closest(".c-head");
    if (!head) { return; }
    head.parentElement.classList.toggle("open");
  });

  // 一键全部折叠 / 展开
  document.getElementById("toggleAll").addEventListener("click", function () {
    var cards = document.querySelectorAll("article.card");
    var anyOpen = Array.prototype.some.call(cards, function (c) {
      return c.classList.contains("open");
    });
    Array.prototype.forEach.call(cards, function (c) {
      c.classList.toggle("open", !anyOpen);
    });
    this.textContent = anyOpen ? "全部展开" : "全部折叠";
  });

  // 把带缩进的纯文本转成层级列表，让「分类框架」这类内容能看出结构
  function formatText(text) {
    if (!text) { return ""; }
    var lines = text.split(/\n/);
    var hasList = lines.some(function (l) { return /^\s*(\d+[.)]|[-*•])\s+/.test(l); });
    if (!hasList) {
      return text.split(/\n{2,}/).map(function (p) {
        return "<p>" + esc(p.trim()).replace(/\n/g, "<br>") + "</p>";
      }).join("");
    }

    var html = [];
    var stack = [];   // 每层的缩进宽度
    lines.forEach(function (raw) {
      if (!raw.trim()) { return; }
      var m = raw.match(/^(\s*)(\d+[.)]|[-*•])\s+(.*)$/);
      if (!m) {
        if (html.length && stack.length) {
          html[html.length - 1] = html[html.length - 1].replace(/<\/li>$/, " " + esc(raw.trim()) + "</li>");
        } else {
          html.push("<p>" + esc(raw.trim()) + "</p>");
        }
        return;
      }
      var indent = m[1].replace(/\t/g, "    ").length;
      var body = esc(m[3]);
      if (m[2].match(/^\d/)) { body = "<b>" + body + "</b>"; }

      while (stack.length && indent < stack[stack.length - 1]) {
        html.push("</li></ul>"); stack.pop();
      }
      if (!stack.length || indent > stack[stack.length - 1]) {
        html.push("<ul>"); stack.push(indent);
      } else {
        html.push("</li>");
      }
      html.push("<li>" + body);
    });
    while (stack.length) { html.push("</li></ul>"); stack.pop(); }
    return html.join("");
  }

  /* ==================== 动态演示 ====================
     原语是手写的：画法固定，AI 只负责选型与填空。
     这样样式统一、质量可控，且出问题时能判断是「选错原语」还是「填错参数」。
  */

  function vizSection() {
    var h = ['<section class="group" id="viz" style="--gc:#8A6BB0">'];
    h.push('<div class="g-head"><h2>动态演示</h2>');
    h.push('<span class="count">' + VIZ.length + " 个</span></div>");
    h.push('<div class="viz-list">');
    VIZ.forEach(function (v, i) { h.push(vizCard(v, i)); });
    h.push("</div></section>");
    return h.join("");
  }

  function vizCard(v, i) {
    var label = VIZ_LABEL[v.primitive] || v.primitive;
    var h = ['<article class="viz" data-viz="' + i + '">'];
    h.push('<header class="viz-head">');
    h.push('<span class="viz-kind">' + esc(label) + "</span>");
    h.push("<h3>" + esc(v.title || "未命名演示") + "</h3>");
    h.push('<div class="viz-ctl">');
    h.push('<button class="viz-btn" data-act="prev" aria-label="上一步">←</button>');
    h.push('<button class="viz-btn primary" data-act="play">▶ 演示</button>');
    h.push('<button class="viz-btn" data-act="next" aria-label="下一步">→</button>');
    h.push("</div></header>");

    h.push('<div class="viz-stage">' + stageHTML(v) + "</div>");
    h.push('<div class="viz-detail" data-detail></div>');

    // 页脚：原文依据 + 警告
    h.push('<div class="viz-foot">');
    (v.evidence || []).slice(0, 2).forEach(function (e) {
      h.push('<span class="ev-inline"><span class="ev-page">' +
             esc(e.page ? "p." + e.page : "页?") + "</span>");
      h.push('<span class="ev-quote">' + esc(trunc(e.quote, 90)) + "</span></span>");
    });
    (v.warnings || []).forEach(function (w) {
      h.push('<span class="viz-warn">' + esc(w) + "</span>");
    });
    h.push("</div></article>");
    return h.join("");
  }

  function stageHTML(v) {
    var p = v.params || {};
    if (v.primitive === "pipeline") {
      var stages = p.stages || [];
      var h = ['<div class="pipe-row">'];
      stages.forEach(function (st, k) {
        h.push('<div class="pipe-node">');
        h.push('<span class="pn-idx">' + pad2(k + 1) + "</span>");
        h.push('<span class="pn-name">' + esc(st.name) + "</span></div>");
        if (k < stages.length - 1) {
          h.push('<div class="pipe-link"><span class="pulse"></span></div>');
        }
      });
      h.push("</div>");
      return h.join("");
    }

    if (v.primitive === "example") {
      var h2 = ['<div class="ex-track">'];
      if (p.scenario) {
        h2.push('<div class="ex-scenario"><b>设定　</b>' + esc(p.scenario) + "</div>");
      }
      (p.steps || []).forEach(function (st, k) {
        var issue = (st.issue || "").trim();
        h2.push('<div class="ex-step' + (issue ? " is-issue" : "") + '">');
        h2.push('<div class="ex-rail"><span class="ex-dot">' + (k + 1) +
                '</span><span class="ex-line"></span></div>');
        h2.push('<div class="ex-body"><div class="ex-state">' + esc(st.state) + "</div>");
        if (issue) {
          h2.push('<div class="ex-issue"><b>卡点</b>　' + esc(issue) + "</div>");
        }
        h2.push("</div></div>");
      });
      h2.push("</div>");
      return h2.join("");
    }

    if (v.primitive === "taxonomy") {
      var h3 = ['<div class="tax-tree">'];
      (function walk(node, depth) {
        if (!node || !node.name) { return; }
        h3.push('<div class="tax-node" data-depth="' + depth + '">');
        h3.push('<div class="tax-line"><span class="tax-bullet"></span>');
        h3.push('<span class="tax-name">' + esc(node.name) + "</span>");
        if (node.what) { h3.push('<span class="tax-what">' + esc(node.what) + "</span>"); }
        h3.push("</div>");
        var kids = node.children || [];
        if (kids.length) {
          h3.push('<div class="tax-children">');
          kids.forEach(function (c) { walk(c, depth + 1); });
          h3.push("</div>");
        }
        h3.push("</div>");
      })(p.root, 0);
      h3.push("</div>");
      return h3.join("");
    }

    return '<div class="empty">未知原语，无法渲染。</div>';
  }

  function stepCount(v) {
    var p = v.params || {};
    if (v.primitive === "pipeline") { return Math.max(1, (p.stages || []).length); }
    if (v.primitive === "example") { return Math.max(1, (p.steps || []).length); }
    if (v.primitive === "taxonomy") {
      var max = 0;
      (function walk(n, d) {
        if (!n) { return; }
        max = Math.max(max, d);
        (n.children || []).forEach(function (c) { walk(c, d + 1); });
      })(p.root, 0);
      return max + 1;
    }
    return 1;
  }

  function applyStep(el, v, i) {
    if (v.primitive === "pipeline") {
      var nodes = el.querySelectorAll(".pipe-node");
      Array.prototype.forEach.call(nodes, function (n, k) {
        n.classList.toggle("is-done", k < i);
        n.classList.toggle("is-active", k === i);
      });
      var links = el.querySelectorAll(".pipe-link");
      Array.prototype.forEach.call(links, function (l, k) {
        l.classList.toggle("on", k < i);
        l.classList.toggle("flow", k === i);
      });
      return;
    }
    if (v.primitive === "example") {
      var steps = el.querySelectorAll(".ex-step");
      Array.prototype.forEach.call(steps, function (s, k) {
        s.classList.toggle("is-done", k < i);
        s.classList.toggle("is-active", k === i);
      });
      return;
    }
    if (v.primitive === "taxonomy") {
      var nodes2 = el.querySelectorAll(".tax-node");
      Array.prototype.forEach.call(nodes2, function (n) {
        var d = Number(n.getAttribute("data-depth"));
        n.setAttribute("data-hidden", d > i ? "1" : "0");
      });
    }
  }

  function renderDetail(box, v, i) {
    if (!box) { return; }
    var p = v.params || {};
    var total = stepCount(v);
    var h = [];

    if (v.primitive === "pipeline") {
      var st = (p.stages || [])[i] || {};
      h.push('<div class="vd-top"><span class="vd-num">' + pad2(i + 1) + " / " +
             pad2(total) + '</span><span class="vd-name">' + esc(st.name) + "</span></div>");
      h.push('<p class="vd-what">' + esc(st.what) + "</p>");
      if ((st.why || "").trim()) {
        h.push('<p class="vd-why"><b>为什么必须有</b>' + esc(st.why) + "</p>");
      } else {
        // 没有 why 往往说明论文没讲清这一步的必要性 —— 这正是值得追问的地方
        h.push('<p class="vd-why missing"><b>注意</b>原文未说明这一步为什么必须有，' +
               "这通常意味着作者默认读者已知，值得在原文里找依据。</p>");
      }
    } else if (v.primitive === "example") {
      var s = (p.steps || [])[i] || {};
      h.push('<div class="vd-top"><span class="vd-num">' + pad2(i + 1) + " / " +
             pad2(total) + '</span><span class="vd-name">第 ' + (i + 1) + " 步</span></div>");
      h.push('<p class="vd-what">' + esc(s.state) + "</p>");
      if ((s.issue || "").trim()) {
        h.push('<p class="vd-issue"><b>在这里卡住　</b>' + esc(s.issue) + "</p>");
      } else {
        h.push('<p class="vd-what" style="margin-top:6px;color:var(--ok)">' +
               "这一步问题被解决了。</p>");
      }
    } else if (v.primitive === "taxonomy") {
      var count = 0;
      (function walk(n, d) {
        if (!n) { return; }
        if (d === i) { count += 1; }
        (n.children || []).forEach(function (c) { walk(c, d + 1); });
      })(p.root, 0);
      var names = ["根节点", "一级分类", "具体方法/子类", "更细的层"];
      h.push('<div class="vd-top"><span class="vd-num">第 ' + i + " 层</span>");
      h.push('<span class="vd-name">' + (names[i] || "第 " + i + " 层") + "</span></div>");
      h.push('<p class="vd-what">这一层展开 ' + count + " 个节点，共 " + total +
             " 层。点「▶ 演示」可从根节点逐层展开。</p>");
    }

    box.innerHTML = h.join("");
  }

  function initViz() {
    Array.prototype.forEach.call(
      document.querySelectorAll("article.viz"),
      function (el) {
        var v = VIZ[Number(el.getAttribute("data-viz"))];
        if (!v) { return; }
        var total = stepCount(v);
        var detail = el.querySelector("[data-detail]");
        // 分类体系默认全展开：它的价值在于一眼看到整个框架，
        // 而不是像流程那样一步步跟着走。演示按钮用来「重播展开过程」。
        var st = { i: v.primitive === "taxonomy" ? total - 1 : 0, timer: null };

        function paint() {
          applyStep(el, v, st.i);
          renderDetail(detail, v, st.i);
          var btn = el.querySelector('[data-act="play"]');
          btn.textContent = st.timer ? "⏸ 暂停"
            : (st.i >= total - 1 ? "↻ 重播" : "▶ 演示");
        }

        function stop() {
          if (st.timer) { clearInterval(st.timer); st.timer = null; }
        }

        function go(n) {
          st.i = Math.max(0, Math.min(total - 1, n));
          paint();
        }

        el.addEventListener("click", function (e) {
          var btn = e.target.closest("[data-act]");
          if (!btn) { return; }
          var act = btn.getAttribute("data-act");

          if (act === "next") { stop(); go(st.i + 1); return; }
          if (act === "prev") { stop(); go(st.i - 1); return; }
          if (act !== "play") { return; }

          if (st.timer) { stop(); paint(); return; }
          if (st.i >= total - 1) { st.i = 0; }
          paint();
          var dwell = v.primitive === "example" ? 1700 : 1400;
          st.timer = setInterval(function () {
            if (st.i >= total - 1) { stop(); paint(); return; }
            st.i += 1;
            paint();
          }, dwell);
        });

        paint();
      }
    );
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function trunc(s, n) {
    s = String(s || "");
    return s.length > n ? s.slice(0, n) + "…" : s;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
})();
</script>
</body>
</html>
